<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>معايرة زوايا السيارة - النسخة التجريبية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; direction: rtl; }
        body { 
            background: #0a0f1e; 
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        #video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            transform: scaleX(-1); /* عكس الكاميرا لتكون كالمرآة */
        }
        #canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* ليمرر اللمس للزر تحته */
        }
        /* لوحة البيانات الشفافة */
        #dashboard {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
            pointer-events: auto;
        }
        .sensor-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 10px 5px;
        }
        .sensor-label {
            font-size: 11px;
            color: #8e9aaf;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sensor-value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 5px;
            font-family: 'Courier New', monospace;
        }
        .value-beta { color: #4fc3f7; } /* الميلان الأمامي/الخلفي (Camber) */
        .value-gamma { color: #ffb74d; } /* الميلان الجانبي (Toe/Caster) */
        .value-alpha { color: #81c784; } /* الاتجاه (Yaw) */
        #start-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: bold;
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.6);
            z-index: 20;
            cursor: pointer;
            pointer-events: auto;
            letter-spacing: 1px;
        }
        #status-text {
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: #aab;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            backdrop-filter: blur(4px);
            z-index: 10;
            pointer-events: none;
        }
        .small-note {
            font-size: 9px;
            color: #5a6a7e;
            margin-top: 4px;
        }
        @media (max-width: 500px) {
            .sensor-value { font-size: 20px; }
        }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas-overlay"></canvas>
    
    <div id="status-text">⏳ انتظر تشغيل الكاميرا والمستشعرات...</div>
    <button id="start-btn">📸 تشغيل الكاميرا والمعايرة</button>

    <!-- لوحة عرض الزوايا -->
    <div id="dashboard">
        <div class="sensor-card">
            <div class="sensor-label">📐 الميلان (Camber)</div>
            <div class="sensor-value value-beta" id="val-beta">0.00°</div>
            <div class="small-note">إمالة العجلة للداخل/الخارج</div>
        </div>
        <div class="sensor-card">
            <div class="sensor-label">🔄 الانحراف (Toe/Caster)</div>
            <div class="sensor-value value-gamma" id="val-gamma">0.00°</div>
            <div class="small-note">دوران العجلة يمين/يسار</div>
        </div>
        <div class="sensor-card">
            <div class="sensor-label">🧭 البوصلة (الاتجاه)</div>
            <div class="sensor-value value-alpha" id="val-alpha">0.00°</div>
            <div class="small-note">زاوية انعطاف الهاتف</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // --- العناصر ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas-overlay');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');

        const betaEl = document.getElementById('val-beta');
        const gammaEl = document.getElementById('val-gamma');
        const alphaEl = document.getElementById('val-alpha');

        let stream = null;
        let isRunning = false;

        // --- ضبط حجم Canvas ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- رسم شبكة وخطوط فوق الكاميرا (للمساعدة البصرية) ---
        function drawGuidelines() {
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            // خط أفقي في المنتصف (مستوى الأفق)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0, 255, 200, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 12]);
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            ctx.stroke();

            // خط عمودي في المنتصف
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 200, 0, 0.6)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 12]);
            ctx.moveTo(w / 2, 0);
            ctx.lineTo(w / 2, h);
            ctx.stroke();

            // إطار دائري في المنتصف (لمحاذاة الجنط)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 100, 100, 0.4)';
            ctx.lineWidth = 3;
            ctx.setLineDash([]);
            const radius = Math.min(w, h) * 0.22;
            ctx.arc(w / 2, h / 2, radius, 0, 2 * Math.PI);
            ctx.stroke();
            
            // كتابة تعليق بسيط
            ctx.font = '14px Arial';
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillText('حاذِ العلامة مع الدائرة', w/2 - 60, h/2 + radius + 30);
            
            ctx.setLineDash([]);
        }

        // --- تشغيل الكاميرا ---
        async function startCamera() {
            try {
                statusText.innerText = '⌛ جاري طلب صلاحية الكاميرا...';
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false 
                });
                video.srcObject = stream;
                await video.play();
                statusText.innerText = '✅ الكاميرا تعمل. قم بتثبيت الهاتف على السيارة.';
                startBtn.style.display = 'none';
                isRunning = true;
                drawGuidelines();
                // تحديث الرسم كل ثانية لإزالة التشويش
                setInterval(drawGuidelines, 1000);
            } catch (err) {
                statusText.innerText = '❌ خطأ: لم نتمكن من فتح الكاميرا. امنح الصلاحية يدوياً.';
                console.error(err);
                startBtn.style.display = 'block';
            }
        }

        // --- مستشعرات الاتجاه (العمود الفقري للزوايا) ---
        function initSensors() {
            // نتحقق إذا كان الهاتف يدعم المستشعرات
            if (window.DeviceOrientationEvent) {
                // للأندرويد الحديث، بعض المتصفحات تطلب إذناً خاصاً للمستشعرات (Android 13+)
                // لكننا سنستخدم الطريقة العادية مع محاولة الطلب.
                window.addEventListener('deviceorientation', handleOrientation, true);
                statusText.innerText = '🔄 مستشعرات الميلان مفعلة.';
            } else {
                statusText.innerText = '⚠️ هاتفك لا يدعم مستشعرات الميلان المتقدمة.';
            }

            // محاولة طلب إذن المستشعرات (لأندرويد 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                .then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                    } else {
                        statusText.innerText = '⛔ تم رفض صلاحية المستشعرات.';
                    }
                }).catch(() => {});
            }
        }

        // --- دالة حساب الزوايا وتحديث الشاشة ---
        function handleOrientation(event) {
            if (!isRunning) return;

            // Alpha: الاتجاه (البوصلة) 0-360
            let alpha = event.alpha || 0;
            // Beta: الميلان الأمامي/الخلفي (يمثل Camber) -180 إلى 180
            let beta = event.beta || 0;
            // Gamma: الميلان الجانبي (يمثل Toe/Caster) -90 إلى 90
            let gamma = event.gamma || 0;

            // تقريب القيم لعرضها بشكل جميل
            const betaFixed = beta.toFixed(2);
            const gammaFixed = gamma.toFixed(2);
            const alphaFixed = alpha.toFixed(2);

            betaEl.innerText = `${betaFixed}°`;
            gammaEl.innerText = `${gammaFixed}°`;
            alphaEl.innerText = `${alphaFixed}°`;

            // تغيير لون الخلفية بشكل بسيط حسب شدة الميلان (تأثير بصري)
            const intensity = Math.min(Math.abs(beta) / 45, 1);
            document.getElementById('dashboard').style.borderColor = 
                `rgba(255, ${200 - intensity * 150}, 100, ${0.2 + intensity * 0.5})`;
        }

        // --- زر البدء ---
        startBtn.addEventListener('click', () => {
            startCamera();
            initSensors();
        });

        // محاولة البدء التلقائي عند تحميل الصفحة (قد تمنعها سياسة المتصفح لكن نجرب)
        setTimeout(() => {
            if (!isRunning) {
                statusText.innerText = '👆 اضغط على الزر الأخضر لتشغيل الكاميرا.';
            }
        }, 1000);

        console.log('🚀 تطبيق معايرة السيارات جاهز. الخبير معك.');
    })();
</script>
</body>
</html>
