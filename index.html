<!DOCTYPE html>
<html lang="ar" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e" id="theme-color">
    <link rel="manifest" href="manifest.json">
    <title>معايرة زوايا السيارة - الخبير</title>
    <style>
        :root {
            --snap-yellow: #FFFC00; --snap-blue: #1A2A4A; --snap-white: #FFFFFF;
            --snap-black: #0D0D0D; --snap-gray: #F5F5F5;
            --bg-primary: var(--snap-gray); --bg-secondary: var(--snap-white);
            --text-primary: var(--snap-black); --text-secondary: #333333;
            --border-color: #E0E0E0; --shadow-color: rgba(0,0,0,0.1);
            --card-bg: var(--snap-white); --progress-bg: #E0E0E0; --status-bg: #F0F0F0;
        }
        body[data-theme="dark"] {
            --bg-primary: var(--snap-black); --bg-secondary: #1A1A1A;
            --text-primary: var(--snap-white); --text-secondary: #CCCCCC;
            --border-color: #333333; --shadow-color: rgba(255,255,255,0.05);
            --card-bg: #262626; --progress-bg: #333333; --status-bg: #1A1A1A;
        }
        body[data-theme="light"] {
            --bg-primary: var(--snap-gray); --bg-secondary: var(--snap-white);
            --text-primary: var(--snap-black); --text-secondary: #333333;
            --border-color: #E0E0E0; --shadow-color: rgba(0,0,0,0.1);
            --card-bg: var(--snap-white); --progress-bg: #E0E0E0; --status-bg: #F0F0F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; direction: rtl; }
        html, body { width: 100%; height: 100%; min-height: 100vh; background: var(--bg-primary); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text-primary); display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }

        #progress-bar { padding: 10px 15px; display: flex; gap: 10px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        #progress-text { font-size: 13px; font-weight: 600; min-width: 70px; }
        .progress-track { flex: 1; height: 4px; background: var(--progress-bg); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--snap-yellow); transition: width 0.5s; }

        #step-title { font-size: 16px; font-weight: 700; padding: 8px 15px 0; color: var(--text-primary); }
        #content-area { flex: 1; padding: 8px 15px 5px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

        .step-description { font-size: 13px; color: var(--text-secondary); line-height: 1.5; background: var(--card-bg); padding: 10px 12px; border-radius: 12px; border-right: 3px solid var(--snap-yellow); box-shadow: 0 2px 8px var(--shadow-color); }
        .visual-helper { display: flex; justify-content: center; padding: 8px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); font-family: 'Courier New', monospace; font-size: 11px; white-space: pre; direction: ltr; overflow-x: auto; box-shadow: 0 2px 8px var(--shadow-color); }

        .angle-big { font-size: 30px; font-weight: 800; text-align: center; padding: 5px; direction: ltr; background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 8px var(--shadow-color); }
        .angle-deg { font-size: 18px; font-weight: 300; color: var(--text-secondary); }
        
        .sub-reading { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        .sub-card { background: var(--card-bg); border-radius: 10px; padding: 6px; text-align: center; box-shadow: 0 2px 8px var(--shadow-color); }
        .sub-label { font-size: 10px; color: var(--text-secondary); }
        .sub-value { font-size: 16px; font-weight: 700; }
        .value-beta { color: #4FC3F7; } .value-gamma { color: #FFB74D; }

        .action-row { display: flex; gap: 10px; }
        .action-btn { padding: 10px; border-radius: 40px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-record { background: #FF6B6B; color: white; }
        .btn-tare { background: var(--snap-yellow); color: var(--snap-black); }
        .btn-tare:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-sensor { background: #FF9800; color: white; }

        #nav-buttons { padding: 10px 15px 15px; display: flex; gap: 10px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); }
        .nav-btn { padding: 10px; border-radius: 40px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; flex: 1; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .status-msg { text-align: center; font-size: 11px; color: var(--text-secondary); padding: 4px; background: var(--status-bg); }

        #theme-toggle { position: fixed; bottom: 70px; right: 10px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px var(--shadow-color); display: flex; align-items: center; justify-content: center; }

        .gauge-container { background: var(--card-bg); border-radius: 12px; padding: 8px; box-shadow: 0 2px 8px var(--shadow-color); margin-bottom: 8px; position: relative; }
        .gauge-svg { width: 100%; max-height: 180px; }
        .circle-degree { font-size: 20px; font-weight: 800; fill: var(--text-primary); }

        .status-indicator { position: absolute; top: 5px; right: 5px; font-size: 18px; font-weight: 800; color: #fff; padding: 2px 8px; border-radius: 20px; background: #10B981; }
        .status-indicator.warning { background: #FFB74D; }
        .status-indicator.danger { background: #FF6B6B; }
        .status-indicator.excellent { background: #4FC3F7; }

        @keyframes pulseGreen {
            0% { background-color: #10B981; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { background-color: #34D399; box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { background-color: var(--snap-blue); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .nav-pulse { animation: pulseGreen 1.5s ease-in-out 2; }

        @keyframes flashEffect { 0% { opacity: 0.3; } 100% { opacity: 1; } }
        .flash { animation: flashEffect 0.3s ease-in-out; }

        .chart-container { background: var(--card-bg); border-radius: 16px; padding: 15px; margin-bottom: 10px; text-align: center; }
        .chart-title { font-weight: 800; margin-bottom: 10px; font-size: 14px; }
        .chart-svg { width: 100%; max-width: 250px; height: auto; }

        #custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-box { background: var(--card-bg); padding: 15px; border-radius: 20px; max-width: 300px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: #FF6B6B; }
        .modal-text { font-size: 14px; line-height: 1.6; margin-bottom: 15px; }
        .modal-btn { padding: 10px 15px; margin: 5px; border-radius: 40px; font-weight: 700; border: none; cursor: pointer; }
        .btn-continue { background: #FF6B6B; color: white; }
        .btn-cancel { background: var(--progress-bg); color: var(--text-secondary); }
    </style>
</head>
<body>

    <div id="progress-bar">
        <span id="progress-text">الخطوة 0/7</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div id="step-title">📋 تعليمات ما قبل البدء</div>

    <div id="content-area"><div id="step-content"></div></div>

    <div id="nav-buttons">
        <button class="nav-btn btn-secondary" id="nav-back">↩ رجوع</button>
        <button class="nav-btn btn-primary" id="nav-next">التالي ➜</button>
    </div>
    <div class="status-msg" id="status-msg">💡 اتبع الخطوات بالترتيب</div>

    <button id="theme-toggle">🌙</button>
    
    <div id="custom-modal">
        <div class="modal-box">
            <div class="modal-title">⚠️ تحذير: الأرض غير مستوية!</div>
            <div class="modal-text">القياس على أرض غير مستوية سيعطي نتائج خاطئة.<br>هل تريد المتابعة؟</div>
            <button class="modal-btn btn-cancel" id="modal-cancel">إلغاء</button>
            <button class="modal-btn btn-continue" id="modal-continue">أكمل على أي حال</button>
        </div>
    </div>

<script>
    (function() {
        let rawBeta = 0, rawGamma = 0;
        let sensorActive = false, sensorError = false;
        let wakeLock = null;

        function flashElement(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.classList.add('flash');
                setTimeout(() => el.classList.remove('flash'), 300);
            }
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch(e) {}
        }
        requestWakeLock();

        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                if (type === 'good') oscillator.frequency.value = 600;
                else if (type === 'warning') oscillator.frequency.value = 400;
                else oscillator.frequency.value = 500;
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function vibrate(type) {
            if ('vibrate' in navigator) {
                navigator.vibrate(type === 'warning' ? 100 : 50);
            }
        }

        async function enableSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        sensorActive = true;
                        window.addEventListener('deviceorientation', handleOrientation);
                        statusMsg.textContent = '✅ الحساسات مفعلة';
                    } else { sensorError = true; statusMsg.textContent = '⛔ رفضت الإذن'; }
                } catch (error) { sensorError = true; statusMsg.textContent = '❌ خطأ'; }
            } else if (typeof DeviceOrientationEvent !== 'undefined') {
                sensorActive = true;
                window.addEventListener('deviceorientation', handleOrientation);
                statusMsg.textContent = '✅ تعمل تلقائياً';
            } else { sensorError = true; statusMsg.textContent = '❌ لا يدعم'; }
        }

        function handleOrientation(event) {
            if (event.beta !== null && event.gamma !== null) {
                rawBeta = event.beta; rawGamma = event.gamma;
                updateDynamicGauges();
            }
        }

        const steps = [
            { id: 'intro', title: '📋 تعليمات', desc: 'اقرأ التعليمات ثم اضغط "بدء".', visual: `┌──────────────────┐\n│  🛠️  تجهيز      │\n│  🚗 أرض مستوية  │\n└──────────────────┘` },
            { id: 'ground', title: '🧭 الأرض', desc: 'ضع الهاتف على الأرض. اضغط تسجيل.', showCircular: true, hasRecordButton: true },
            { id: 'tare', title: '🎯 معايرة الصفر', desc: 'ضع الهاتف مسطحاً على أرضية السيارة.', showCircular: true, hasTareButton: true },
            { id: 'fr', title: '🚗 الأمامية اليمنى (FR)', desc: 'ضع الهاتف عمودياً على الجنط واضغط تسجيل.', showCircular: true, side: 'fr' },
            { id: 'fl', title: '🚗 الأمامية اليسرى (FL)', desc: 'ضع الهاتف عمودياً على الجنط واضغط تسجيل.', showCircular: true, side: 'fl' },
            { id: 'rr', title: '🚙 الخلفية اليمنى (RR)', desc: 'ضع الهاتف على الجنط واضغط تسجيل.', showCircular: true, side: 'rr' },
            { id: 'rl', title: '🚙 الخلفية اليسرى (RL)', desc: 'ضع الهاتف على الجنط واضغط تسجيل.', showCircular: true, side: 'rl' },
            { id: 'report', title: '📊 التقرير النهائي', desc: 'إليك ملخص القراءات.', isReport: true }
        ];

        let currentStep = 0;
        let readings = { ground: null, fr: null, fl: null, rr: null, rl: null };
        let tareOffset = { beta: 0, gamma: 0 };
        let tareDone = false, floorWarningAccepted = false;

        const stepContent = document.getElementById('step-content');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const stepTitle = document.getElementById('step-title');
        const navBack = document.getElementById('nav-back');
        const navNext = document.getElementById('nav-next');
        const statusMsg = document.getElementById('status-msg');
        const themeToggle = document.getElementById('theme-toggle');
        const customModal = document.getElementById('custom-modal');

        themeToggle.addEventListener('click', () => {
            const newTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        function getDisplayAngle() { return { beta: rawBeta - tareOffset.beta, gamma: rawGamma - tareOffset.gamma }; }
        function formatAngle(angle) { return angle === null ? '---' : `${angle >= 0 ? '+' : ''}${angle.toFixed(2)}°`; }

        function updateDynamicGauges() {
            const circleDegree = document.getElementById('circle-degree');
            if (circleDegree) circleDegree.textContent = formatAngle(getDisplayAngle().beta);
        }

        // دالة الملاحة للخطوة التالية
        function goToNextStep() {
            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep(currentStep);
            }
        }

        function renderStep(index) {
            const step = steps[index];
            if (!step) return;
            progressText.textContent = `الخطوة ${index}/${steps.length - 1}`;
            progressFill.style.width = `${(index / (steps.length - 1)) * 100}%`;
            stepTitle.textContent = step.title;

            let html = `<div class="step-description">${step.desc}</div>`;
            if (step.hasRecordButton) html += `<button class="action-btn btn-record" id="record-btn">📝 تسجيل القراءة</button>`;
            if (step.hasTareButton) html += `<button class="action-btn btn-tare" id="tare-action-btn">🎯 معايرة الصفر</button>`;
            
            // إضافة زر التسجيل لعجلات السيارة
            if (step.side) {
                const recorded = readings[step.side] !== null;
                html += `<button class="action-btn btn-record" id="record-wheel-btn">${recorded ? '✅ تم التسجيل (إعادة؟)' : '📝 تسجيل قراءة العجلة'}</button>`;
            }

            stepContent.innerHTML = html;

            if (step.hasRecordButton) document.getElementById('record-btn').onclick = recordGround;
            if (step.hasTareButton) document.getElementById('tare-action-btn').onclick = performTare;
            if (step.side) document.getElementById('record-wheel-btn').onclick = () => saveWheelReading(step.side);
            
            navBack.style.display = index === 0 ? 'none' : 'block';
        }

        // تسجيل قراءة الأرض والانتقال التلقائي
        function recordGround() {
            readings.ground = getDisplayAngle().beta;
            playSound('good'); vibrate('good');
            flashElement('record-btn');
            
            // انتقال تلقائي بعد 800 ميلي ثانية
            setTimeout(() => {
                goToNextStep();
            }, 800);
        }

        // إجراء المعايرة والانتقال التلقائي
        function performTare() {
            tareOffset.beta = rawBeta; tareOffset.gamma = rawGamma; tareDone = true;
            playSound('good'); vibrate('good');
            flashElement('tare-action-btn');

            // انتقال تلقائي بعد 800 ميلي ثانية
            setTimeout(() => {
                goToNextStep();
            }, 800);
        }

        // تسجيل قراءة العجلة والانتقال التلقائي
        function saveWheelReading(side) {
            const { beta } = getDisplayAngle();
            readings[side] = beta;
            playSound('good'); vibrate('good');
            flashElement('record-wheel-btn');

            // انتقال تلقائي بعد 800 ميلي ثانية
            setTimeout(() => {
                goToNextStep();
            }, 800);
        }

        navNext.addEventListener('click', goToNextStep);

        navBack.addEventListener('click', () => {
            if (currentStep > 0) { currentStep--; renderStep(currentStep); }
        });

        renderStep(0);
    })();
</script>
</body>
</html>
