<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e" id="theme-color">
    <link rel="manifest" href="manifest.json">
    <title>معايرة زوايا السيارة - دليل تفاعلي</title>
    <style>
        /* --- المتغيرات الأساسية --- */
        :root {
            --snap-yellow: #FFFC00;
            --snap-yellow-dark: #E6E600;
            --snap-blue: #1A2A4A;
            --snap-blue-light: #2A3A6A;
            --snap-white: #FFFFFF;
            --snap-black: #0D0D0D;
            --snap-gray: #F5F5F5;
            --snap-dark-gray: #1A1A1A;
            
            --bg-primary: var(--snap-gray);
            --bg-secondary: var(--snap-white);
            --text-primary: var(--snap-black);
            --text-secondary: #333333;
            --border-color: #E0E0E0;
            --shadow-color: rgba(0,0,0,0.1);
            --card-bg: var(--snap-white);
            --progress-bg: #E0E0E0;
            --status-bg: #F0F0F0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: var(--snap-black);
                --bg-secondary: #1A1A1A;
                --text-primary: var(--snap-white);
                --text-secondary: #CCCCCC;
                --border-color: #333333;
                --shadow-color: rgba(255,255,255,0.05);
                --card-bg: #262626;
                --progress-bg: #333333;
                --status-bg: #1A1A1A;
            }
        }

        .light-mode {
            --bg-primary: var(--snap-gray);
            --bg-secondary: var(--snap-white);
            --text-primary: var(--snap-black);
            --text-secondary: #333333;
            --border-color: #E0E0E0;
            --shadow-color: rgba(0,0,0,0.1);
            --card-bg: var(--snap-white);
            --progress-bg: #E0E0E0;
            --status-bg: #F0F0F0;
        }
        .dark-mode {
            --bg-primary: var(--snap-black);
            --bg-secondary: #1A1A1A;
            --text-primary: var(--snap-white);
            --text-secondary: #CCCCCC;
            --border-color: #333333;
            --shadow-color: rgba(255,255,255,0.05);
            --card-bg: #262626;
            --progress-bg: #333333;
            --status-bg: #1A1A1A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; direction: rtl; }
        html, body {
            width: 100%; height: 100%; height: 100dvh; overflow: hidden;
            background: var(--bg-primary);
            font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
            color: var(--text-primary);
            position: fixed; top: 0; left: 0;
            display: flex; flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        #progress-bar {
            padding: 20px 20px 10px;
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            transition: background 0.3s;
        }
        #progress-text {
            font-size: 14px; font-weight: 600;
            color: var(--text-secondary);
            min-width: 70px;
        }
        .progress-track {
            flex: 1; height: 6px;
            background: var(--progress-bg);
            border-radius: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: var(--snap-yellow);
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(255, 252, 0, 0.3);
        }

        #step-title {
            font-size: 18px; font-weight: 700;
            padding: 12px 20px 0;
            color: var(--text-primary);
            transition: color 0.3s;
        }

        #content-area {
            flex: 1; padding: 10px 20px 5px; overflow-y: auto;
            display: flex; flex-direction: column;
            gap: 10px;
        }

        .step-description {
            font-size: 15px; color: var(--text-secondary);
            line-height: 1.6;
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 16px;
            border-right: 4px solid var(--snap-yellow);
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: background 0.3s, color 0.3s;
        }

        .visual-helper {
            display: flex; justify-content: center; align-items: center;
            padding: 15px 10px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            min-height: 140px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre;
            color: var(--text-secondary);
            direction: ltr;
            transition: background 0.3s, border-color 0.3s;
            overflow-x: auto;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .angle-big {
            font-size: 70px; font-weight: 800;
            font-family: 'Courier New', monospace;
            text-align: center; padding: 10px 0;
            direction: ltr;
            transition: color 0.2s;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        .angle-deg { font-size: 30px; font-weight: 300; color: var(--text-secondary); }

        .sub-reading {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .sub-card {
            background: var(--card-bg);
            border-radius: 14px; padding: 10px; text-align: center;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: background 0.3s;
        }
        .sub-label { font-size: 11px; color: var(--text-secondary); }
        .sub-value { font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace; }
        .value-beta { color: #4FC3F7; }
        .value-gamma { color: #FFB74D; }

        .action-row {
            display: flex; gap: 12px;
        }
        .action-btn {
            padding: 14px 20px; border-radius: 60px; border: none;
            font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.2s; flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .action-btn:active { transform: scale(0.95); }
        .btn-tare {
            background: var(--snap-yellow); color: var(--snap-black);
            box-shadow: 0 4px 20px rgba(255, 252, 0, 0.3);
        }
        .btn-tare:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-success {
            background: #10B981; color: white;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }
        .btn-primary {
            background: var(--snap-blue); color: white;
            box-shadow: 0 4px 20px rgba(26, 42, 74, 0.3);
        }
        .btn-secondary {
            background: var(--card-bg); color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-record {
            background: #FF6B6B; color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
        }

        #nav-buttons {
            padding: 15px 20px 25px;
            display: flex; gap: 12px; justify-content: space-between;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            transition: background 0.3s;
        }
        .nav-btn {
            padding: 14px 24px; border-radius: 60px; border: none;
            font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.2s; flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        #nav-back { flex: 0.5; }

        .status-msg {
            text-align: center; font-size: 12px;
            color: var(--text-secondary); padding: 6px;
            min-height: 30px;
            background: var(--status-bg);
            border-top: 1px solid var(--border-color);
            transition: background 0.3s, color 0.3s;
        }

        .tare-done-badge {
            background: #10B981; color: white;
            padding: 4px 12px; border-radius: 40px;
            font-size: 12px; font-weight: 600;
            display: inline-block;
        }

        .checklist {
            background: var(--card-bg);
            border-radius: 16px; padding: 12px 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: background 0.3s;
        }
        .checklist-item {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px; color: var(--text-secondary);
        }
        .checklist-item:last-child { border-bottom: none; }
        .check-icon { font-size: 22px; width: 30px; text-align: center; }

        #theme-toggle {
            position: fixed; bottom: 90px; right: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 48px; height: 48px;
            font-size: 22px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #theme-toggle:active { transform: scale(0.9); }

        .bubble-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--border-color);
            margin-top: 10px;
            transition: background 0.3s;
        }
        .bubble-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .bubble-track {
            height: 20px;
            background: var(--progress-bg);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .bubble-fill {
            height: 100%;
            border-radius: 40px;
            transition: width 0.15s ease;
        }
        .bubble-marker {
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 28px;
            background: var(--text-primary);
            opacity: 0.3;
            border-radius: 4px;
        }
        .bubble-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        @media (max-width: 450px) {
            .angle-big { font-size: 50px; }
            .visual-helper { font-size: 12px; min-height: 100px; padding: 10px; }
            .nav-btn { font-size: 14px; padding: 12px 16px; }
            .action-btn { font-size: 14px; padding: 12px 16px; }
            #theme-toggle { width: 40px; height: 40px; font-size: 18px; bottom: 80px; right: 10px; }
        }
    </style>
</head>
<body>

    <div id="progress-bar">
        <span id="progress-text">الخطوة 0/7</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div id="step-title">📋 تعليمات ما قبل البدء</div>

    <div id="content-area">
        <div id="step-content"></div>
    </div>

    <div id="nav-buttons">
        <button class="nav-btn btn-secondary" id="nav-back">↩ رجوع</button>
        <button class="nav-btn btn-primary" id="nav-next">التالي ➜</button>
    </div>
    <div class="status-msg" id="status-msg">💡 اتبع الخطوات بالترتيب للحصول على أفضل النتائج</div>

    <button id="theme-toggle">🌙</button>

<script>
    (function() {
        // --- بيانات الخطوات مع الرسوم التوضيحية ---
        const steps = [

                ]

            {

                visual: `

                showAngle: true,
                hasRecordButton: true,

            {
                id: 'tare',
                title: '🎯 الخطوة 2: معايرة الصفر (Tare)',
                desc: 'ضع الهاتف مسطحاً على أرضية السيارة الداخلية (بجانب المقعد) كما في الصورة. ثم اضغط زر "معايرة الصفر".',
                visual: `
┌─────────────────────────────────┐
│  🪑 مقعد السيارة               │
│  ┌────────────────────────┐    │
│  │  🟫🟫🟫🟫🟫🟫🟫🟫🟫   │    │

│  └────────────────────────┘    │
└─────────────────────────────────┘`,
                showAngle: true,
                hasTareButton: true
            },
            {
                id: 'fr',
                title: '🚗 الخطوة 3: قياس العجلة الأمامية اليمنى (FR)',
                desc: 'ضع الهاتف عمودياً على الجنط المعدني للعجلة الأمامية اليمنى (جهة الراكب). تأكد من استقامة الهاتف كما في الصورة.',
                visual: `
┌─────────────────────────────────┐
│         ⚙️                      │
│         ⚙️ (الجنط)    ┌──┐    │
│         ⚙️             │📱│    │
│         ⚙️             └──┘    │
│         ⚙️   (الهاتف عمودي)   │
│         ⚙️                      │
│  🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫  │
│  🟫 (الأرض) 🟫                  │
└─────────────────────────────────┘`,
                showAngle: true,
                side: 'fr'
            },
            {
                id: 'fl',
                title: '🚗 الخطوة 4: قياس العجلة الأمامية اليسرى (FL)',
                desc: 'ضع الهاتف عمودياً على الجنط المعدني للعجلة الأمامية اليسرى (جهة السائق). نفس الطريقة كما في الصورة.',
                visual: `

└─────────────────────────────────┘`,
                showAngle: true,
                side: 'fl'
            },
            {
                id: 'rr',
                title: '🚙 الخطوة 5: قياس العجلة الخلفية اليمنى (RR) - اختياري',
                desc: 'ضع الهاتف عمودياً على الجنط الخلفي الأيمن. يمكنك تخطي هذه الخطوة إذا أردت.',
                visual: `
┌─────────────────────────────────┐
│         ⚙️                      │
│         ⚙️ (الجنط)    ┌──┐    │
│         ⚙️             │📱│    │
│         ⚙️             └──┘    │
│         ⚙️   (الهاتف عمودي)   │
│         ⚙️                      │
│  🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫  │
│  🟫 (الأرض) 🟫                  │
└─────────────────────────────────┘`,
                showAngle: true,
                side: 'rr'
            },
            {
                id: 'rl',
                title: '🚙 الخطوة 6: قياس العجلة الخلفية اليسرى (RL) - اختياري',
                desc: 'ضع الهاتف عمودياً على الجنط الخلفي الأيسر. هذه آخر قراءة اختيارية.',
                visual: `
┌─────────────────────────────────┐
│         ⚙️                      │
│         ⚙️ (الجنط)    ┌──┐    │
│         ⚙️             │📱│    │
│         ⚙️             └──┘    │
│         ⚙️   (الهاتف عمودي)   │
│         ⚙️                      │
│  🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫  │
│  🟫 (الأرض) 🟫                  │
└─────────────────────────────────┘`,
                showAngle: true,
                side: 'rl'
            },
            {
                id: 'report',
                title: '📊 التقرير النهائي',
                desc: 'إليك ملخص جميع القراءات المسجلة مع تقييم أولي لكل زاوية.',
                visual: `
┌─────────────────────────┐
│  📈  التقرير النهائي   │
│                         │
│  ✅ FR: +1.2° (ممتاز) │
│  ⚠️ FL: +2.5° (انتباه)│
│  🔴 RR: -3.0° (ضبط)   │
│  ✅ RL: +1.0° (ممتاز) │
└─────────────────────────┘`,
                isReport: true
            }
        ];

        // --- متغيرات التطبيق ---
        let currentStep = 0;
        let readings = { ground: null, fr: null, fl: null, rr: null, rl: null };
        let tareOffset = { beta: 0, gamma: 0 };
        let rawBeta = 0, rawGamma = 0;
        let isSensorActive = false;
        let tareDone = false;

        // --- عناصر DOM ---
        const stepContent = document.getElementById('step-content');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const stepTitle = document.getElementById('step-title');
        const navBack = document.getElementById('nav-back');
        const navNext = document.getElementById('nav-next');
        const statusMsg = document.getElementById('status-msg');
        const themeToggle = document.getElementById('theme-toggle');

        // --- تبديل الوضع ---
        let isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light-mode', !isDarkMode);
            document.body.classList.toggle('dark-mode', isDarkMode);
            themeToggle.textContent = isDarkMode ? '☀️' : '🌙';
            document.getElementById('theme-color').content = isDarkMode ? '#0D0D0D' : '#F5F5F5';
        }
        themeToggle.addEventListener('click', toggleTheme);
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        } else {
            document.body.classList.add('light-mode');
            themeToggle.textContent = '🌙';
        }

        // --- دوال مساعدة ---
        function getDisplayAngle() {
            const beta = rawBeta - tareOffset.beta;
            const gamma = rawGamma - tareOffset.gamma;
            return { beta, gamma };
        }

        function angleColor(angle) {
            const abs = Math.abs(angle);
            if (abs < 1.0) return '#4FC3F7';
            if (abs < 2.0) return '#FFB74D';
            return '#FF6B6B';
        }

        function formatAngle(angle) {
            if (angle === null || angle === undefined) return '---';
            const sign = angle >= 0 ? '+' : '';
            return `${sign}${angle.toFixed(2)}°`;
        }

        // --- دالة ميزان المياه ---
        function renderLevelBubble(angle, label = 'المستوى') {
            const percent = 50 + (angle / 5) * 50;
            const clamped = Math.min(100, Math.max(0, percent));
            const color = Math.abs(angle) < 0.5 ? '#10B981' : Math.abs(angle) < 1.5 ? '#FFB74D' : '#FF6B6B';
            return `
                <div class="bubble-container">
                    <div class="bubble-header">
                        <span>${label}</span>
                        <span style="color:${color};font-weight:bold;font-family:monospace;">${formatAngle(angle)}</span>
                    </div>
                    <div class="bubble-track">
                        <div class="bubble-fill" style="width:${clamped}%;background:${color};"></div>
                        <div class="bubble-marker"></div>
                    </div>
                    <div class="bubble-labels">
                        <span>− (مائل)</span>
                        <span>0 (مستوي)</span>
                        <span>+ (مائل)</span>
                    </div>
                </div>
            `;
        }

        // --- عرض الخطوة الحالية ---
        function renderStep(index) {
            const step = steps[index];
            if (!step) return;

            const total = steps.length - 1;
