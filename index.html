<!DOCTYPE html>
<html lang="ar" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e" id="theme-color">
    <link rel="manifest" href="manifest.json">
    <title>معايرة زوايا السيارة - الخبير</title>
    <style>
        :root {
            --snap-yellow: #FFFC00; --snap-blue: #1A2A4A; --snap-white: #FFFFFF;
            --snap-black: #0D0D0D; --snap-gray: #F5F5F5;
            --bg-primary: var(--snap-gray); --bg-secondary: var(--snap-white);
            --text-primary: var(--snap-black); --text-secondary: #333333;
            --border-color: #E0E0E0; --shadow-color: rgba(0,0,0,0.1);
            --card-bg: var(--snap-white); --progress-bg: #E0E0E0; --status-bg: #F0F0F0;
        }
        body[data-theme="dark"] {
            --bg-primary: var(--snap-black); --bg-secondary: #1A1A1A;
            --text-primary: var(--snap-white); --text-secondary: #CCCCCC;
            --border-color: #333333; --shadow-color: rgba(255,255,255,0.05);
            --card-bg: #262626; --progress-bg: #333333; --status-bg: #1A1A1A;
        }
        body[data-theme="light"] {
            --bg-primary: var(--snap-gray); --bg-secondary: var(--snap-white);
            --text-primary: var(--snap-black); --text-secondary: #333333;
            --border-color: #E0E0E0; --shadow-color: rgba(0,0,0,0.1);
            --card-bg: var(--snap-white); --progress-bg: #E0E0E0; --status-bg: #F0F0F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; direction: rtl; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-primary); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text-primary); position: fixed; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }

        #progress-bar { padding: 10px 15px; display: flex; gap: 10px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); }
        #progress-text { font-size: 13px; font-weight: 600; min-width: 70px; }
        .progress-track { flex: 1; height: 4px; background: var(--progress-bg); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--snap-yellow); transition: width 0.5s; }

        #step-title { font-size: 16px; font-weight: 700; padding: 8px 15px 0; color: var(--text-primary); }
        #content-area { flex: 1; padding: 8px 15px 5px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

        .step-description { font-size: 13px; color: var(--text-secondary); line-height: 1.5; background: var(--card-bg); padding: 10px 12px; border-radius: 12px; border-right: 3px solid var(--snap-yellow); box-shadow: 0 2px 8px var(--shadow-color); }
        .visual-helper { display: flex; justify-content: center; padding: 8px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); font-family: 'Courier New', monospace; font-size: 11px; white-space: pre; direction: ltr; overflow-x: auto; box-shadow: 0 2px 8px var(--shadow-color); }

        .angle-big { font-size: 30px; font-weight: 800; text-align: center; padding: 5px; direction: ltr; background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 8px var(--shadow-color); }
        .angle-deg { font-size: 18px; font-weight: 300; color: var(--text-secondary); }
        
        /* العدادات الرقمية الحية */
        .sub-reading { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        .sub-card { background: var(--card-bg); border-radius: 10px; padding: 6px; text-align: center; box-shadow: 0 2px 8px var(--shadow-color); }
        .sub-label { font-size: 10px; color: var(--text-secondary); }
        .sub-value { font-size: 16px; font-weight: 700; }
        .value-beta { color: #4FC3F7; } .value-gamma { color: #FFB74D; }

        .action-row { display: flex; gap: 10px; }
        .action-btn { padding: 10px; border-radius: 40px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-record { background: #FF6B6B; color: white; }
        .btn-tare { background: var(--snap-yellow); color: var(--snap-black); }
        .btn-tare:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-success { background: #10B981; color: white; }
        .btn-primary { background: var(--snap-blue); color: white; }
        .btn-secondary { background: var(--card-bg); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-sensor { background: #FF9800; color: white; }

        #nav-buttons { padding: 10px 15px 15px; display: flex; gap: 10px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); }
        .nav-btn { padding: 10px; border-radius: 40px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; flex: 1; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        #nav-back { flex: 0.5; }

        .status-msg { text-align: center; font-size: 11px; color: var(--text-secondary); padding: 4px; background: var(--status-bg); }

        #theme-toggle { position: fixed; bottom: 70px; right: 10px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; z-index: 100; box-shadow: 0 4px 15px var(--shadow-color); display: flex; align-items: center; justify-content: center; }

        .gauge-container { background: var(--card-bg); border-radius: 12px; padding: 8px; box-shadow: 0 2px 8px var(--shadow-color); margin-bottom: 8px; position: relative; }
        .gauge-svg { width: 100%; max-height: 180px; }
        
        /* النص الرقمي داخل القرص */
        .circle-degree { font-size: 20px; font-weight: 800; fill: var(--text-primary); }
        
        .bubble-circle { fill: #66BB6A; stroke: #2E7D32; stroke-width: 2; filter: drop-shadow(0 0 5px rgba(102, 187, 106, 0.8)); }
        .bubble-highlight { fill: #fff; opacity: 0.7; }

        .status-indicator { position: absolute; top: 5px; right: 5px; font-size: 18px; font-weight: 800; color: #fff; padding: 2px 8px; border-radius: 20px; background: #10B981; }
        .status-indicator.warning { background: #FFB74D; }
        .status-indicator.danger { background: #FF6B6B; }
        .status-indicator.excellent { background: #4FC3F7; }

        /* وميض زر المتابعة */
        @keyframes pulseGreen {
            0% { background-color: #10B981; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { background-color: #34D399; box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { background-color: var(--snap-blue); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .nav-pulse { animation: pulseGreen 1.5s ease-in-out 2; }

        @keyframes flashGreen { 0% { background-color: #4FC3F7; } 100% { background-color: var(--card-bg); } }
        .flash { animation: flashGreen 0.3s; }

        .chart-container { background: var(--card-bg); border-radius: 16px; padding: 15px; margin-bottom: 10px; text-align: center; }
        .chart-title { font-weight: 800; margin-bottom: 10px; font-size: 14px; }
        .chart-svg { width: 100%; max-width: 250px; height: auto; }

        #custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-box { background: var(--card-bg); padding: 15px; border-radius: 20px; max-width: 300px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: #FF6B6B; }
        .modal-text { font-size: 14px; line-height: 1.6; margin-bottom: 15px; }
        .modal-btn { padding: 10px 15px; margin: 5px; border-radius: 40px; font-weight: 700; border: none; cursor: pointer; }
        .btn-continue { background: #FF6B6B; color: white; }
        .btn-cancel { background: var(--progress-bg); color: var(--text-secondary); }

        @media (max-width: 450px) {
            .angle-big { font-size: 25px; }
            .nav-btn, .action-btn { font-size: 13px; padding: 8px; }
            .sub-label { font-size: 9px; }
            .sub-value { font-size: 14px; }
            #theme-toggle { width: 35px; height: 35px; font-size: 15px; }
        }
    </style>
</head>
<body>

    <div id="progress-bar">
        <span id="progress-text">الخطوة 0/7</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div id="step-title">📋 تعليمات ما قبل البدء</div>

    <div id="content-area"><div id="step-content"></div></div>

    <div id="nav-buttons">
        <button class="nav-btn btn-secondary" id="nav-back">↩ رجوع</button>
        <button class="nav-btn btn-primary" id="nav-next">التالي ➜</button>
    </div>
    <div class="status-msg" id="status-msg">💡 اتبع الخطوات بالترتيب</div>

    <button id="theme-toggle">🌙</button>
    
    <div id="custom-modal">
        <div class="modal-box">
            <div class="modal-title">⚠️ تحذير: الأرض غير مستوية!</div>
            <div class="modal-text">القياس على أرض غير مستوية سيعطي نتائج خاطئة.<br>هل تريد المتابعة؟</div>
            <button class="modal-btn btn-cancel" id="modal-cancel">إلغاء</button>
            <button class="modal-btn btn-continue" id="modal-continue">أكمل على أي حال</button>
        </div>
    </div>

<script>
    (function() {
        // --- المتغيرات ----
        let rawBeta = 0, rawGamma = 0;
        let sensorActive = false, sensorError = false;
        let wakeLock = null;

        // --- منع انطفاء الشاشة ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch(e) { /* المتصفح لا يدعمه */ }
        }
        requestWakeLock();
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });

        // --- الأصوات والاهتزاز ---
        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                if (type === 'excellent') { oscillator.frequency.value = 900; oscillator.type = 'sine'; }
                else if (type === 'good') { oscillator.frequency.value = 600; oscillator.type = 'sine'; }
                else if (type === 'warning') { oscillator.frequency.value = 400; oscillator.type = 'square'; }
                else if (type === 'danger') { oscillator.frequency.value = 200; oscillator.type = 'sawtooth'; }
                else { oscillator.frequency.value = 500; }
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch(e) { /* لا صوت */ }
        }

        function vibrate(type) {
            if ('vibrate' in navigator) {
                if (type === 'danger') navigator.vibrate([200, 100, 200]);
                else if (type === 'warning') navigator.vibrate(100);
                else if (type === 'good') navigator.vibrate(50);
                else if (type === 'excellent') navigator.vibrate([50, 50, 50]);
            }
        }

        // --- تفعيل الحساسات ---
        async function enableSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        sensorActive = true;
                        window.addEventListener('deviceorientation', handleOrientation);
                        statusMsg.textContent = '✅ الحساسات مفعلة';
                    } else { sensorError = true; statusMsg.textContent = '⛔ رفضت الإذن'; }
                } catch (error) { sensorError = true; statusMsg.textContent = '❌ خطأ'; }
            } else if (typeof DeviceOrientationEvent !== 'undefined') {
                sensorActive = true;
                window.addEventListener('deviceorientation', handleOrientation);
                statusMsg.textContent = '✅ تعمل تلقائياً';
            } else { sensorError = true; statusMsg.textContent = '❌ لا يدعم'; }
        }
        function handleOrientation(event) {
            if (event.beta !== null && event.gamma !== null) {
                rawBeta = event.beta; rawGamma = event.gamma;
                updateDynamicGauges();
            }
        }

        // --- البيانات ---
        const steps = [
            { id: 'intro', title: '📋 تعليمات', desc: 'اقرأ التعليمات ثم اضغط "بدء".', visual: `┌──────────────────┐\n│  🛠️  تجهيز      │\n│  🚗 أرض مستوية  │\n│  🔧 ضغط إطارات  │\n│  🛑 فرامل يد    │\n└──────────────────┘`, checklist: [ { icon: '✅', text: 'السيارة على أرض مستوية.' }, { icon: '✅', text: 'ضغط الإطارات صحيح.' }, { icon: '✅', text: 'أطفئ المحرك واشدد الفرامل.' } ] },
            { id: 'ground', title: '🧭 الأرض', desc: 'ضع الهاتف على الأرض. اضغط تسجيل بعد استقرار القراءة.', visual: `┌────────┐\n│  📱    │\n│ 🟫🟫🟫 │\n└────────┘`, showCircular: true, hasRecordButton: true },
            { id: 'tare', title: '🎯 معايرة الصفر', desc: 'ضع الهاتف مسطحاً على أرضية السيارة. اضغط معايرة.', visual: `┌────────┐\n│ 🪑 مقعد│\n│ ┌──┐  │\n│ │📱│  │\n│ └──┘  │\n└────────┘`, showCircular: true, hasTareButton: true },
            { id: 'fr', title: '🚗 الأمامية اليمنى (FR)', desc: 'ضع الهاتف عمودياً على الجنط.', visual: `┌────────┐\n│ ⚙️ 📱 │\n│ (عمودي)│\n└────────┘`, showCircular: true, side: 'fr' },
            { id: 'fl', title: '🚗 الأمامية اليسرى (FL)', desc: 'ضع الهاتف عمودياً على الجنط.', visual: `┌────────┐\n│ ⚙️ 📱 │\n│ (عمودي)│\n└────────┘`, showCircular: true, side: 'fl' },
            { id: 'rr', title: '🚙 الخلفية اليمنى (RR)', desc: 'اختياري، ضع الهاتف على الجنط.', visual: `┌────────┐\n│ ⚙️ 📱 │\n│ (عمودي)│\n└────────┘`, showCircular: true, side: 'rr' },
            { id: 'rl', title: '🚙 الخلفية اليسرى (RL)', desc: 'اختياري، ضع الهاتف على الجنط.', visual: `┌────────┐\n│ ⚙️ 📱 │\n│ (عمودي)│\n└────────┘`, showCircular: true, side: 'rl' },
            { id: 'report', title: '📊 التقرير النهائي', desc: 'إليك ملخص القراءات مع الرسم الدائري.', visual: `┌─────────┐\n│ 📈 تقرير │\n└─────────┘`, isReport: true }
        ];

        // --- متغيرات التطبيق ---
        let currentStep = 0;
        let readings = { ground: null, fr: null, fl: null, rr: null, rl: null };
        let tareOffset = { beta: 0, gamma: 0 };
        let tareDone = false, floorWarningAccepted = false;

        const stepContent = document.getElementById('step-content');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const stepTitle = document.getElementById('step-title');
        const navBack = document.getElementById('nav-back');
        const navNext = document.getElementById('nav-next');
        const statusMsg = document.getElementById('status-msg');
        const themeToggle = document.getElementById('theme-toggle');
        const customModal = document.getElementById('custom-modal');
        const modalCancel = document.getElementById('modal-cancel');
        const modalContinue = document.getElementById('modal-continue');

        // --- الوضع الليلي ---
        function updateThemeIcon() { themeToggle.textContent = document.body.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
        themeToggle.addEventListener('click', () => {
            const newTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', newTheme);
            document.getElementById('theme-color').content = newTheme === 'dark' ? '#0D0D0D' : '#F5F5F5';
            updateThemeIcon();
        });
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.setAttribute('data-theme', 'dark');
        else document.body.setAttribute('data-theme', 'light');
        updateThemeIcon();

        function getDisplayAngle() { return { beta: rawBeta - tareOffset.beta, gamma: rawGamma - tareOffset.gamma }; }
        function angleColor(angle) { const abs = Math.abs(angle); if (abs < 0.5) return '#4FC3F7'; if (abs < 1.0) return '#10B981'; if (abs < 2.0) return '#FFB74D'; return '#FF6B6B'; }
        function formatAngle(angle) { return angle === null ? '---' : `${angle >= 0 ? '+' : ''}${angle.toFixed(2)}°`; }

        // --- القرص الدائري (مع النص الرقمي الجديد) ---
        function renderCircularGauge(beta, gamma) {
            const max = 10;
            const x = 100 + (Math.max(-max, Math.min(max, gamma)) / max) * 60;
            const y = 100 - (Math.max(-max, Math.min(max, beta)) / max) * 60;
            const total = Math.sqrt(beta*beta + gamma*gamma);
            let state = 'good', color = '#10B981', icon = '✅';
            if (total < 0.5) { state = 'excellent'; color = '#4FC3F7'; icon = '✔'; }
            else if (total < 1.5) { state = 'good'; color = '#10B981'; icon = '✅'; }
            else if (total < 3.0) { state = 'warning'; color = '#FFB74D'; icon = '⚠️'; }
            else { state = 'danger'; color = '#FF6B6B'; icon = '❌'; }
            
            return `
            <div class="gauge-container">
                <div class="status-indicator ${state}">${icon}</div>
                <svg class="gauge-svg" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="95" fill="var(--card-bg)" stroke="#333" stroke-width="2"/>
                    <circle cx="100" cy="100" r="70" fill="none" stroke="#ddd" stroke-width="1"/>
                    <line x1="100" y1="15" x2="100" y2="25" stroke="#333" stroke-width="2"/>
                    <line x1="100" y1="175" x2="100" y2="185" stroke="#333" stroke-width="2"/>
                    <line x1="15" y1="100" x2="25" y2="100" stroke="#333" stroke-width="2"/>
                    <line x1="175" y1="100" x2="185" y2="100" stroke="#333" stroke-width="2"/>
                    <text x="100" y="14" font-size="10" fill="#333" text-anchor="middle">+</text>
                    <text x="100" y="195" font-size="10" fill="#333" text-anchor="middle">-</text>
                    <text x="10" y="103" font-size="10" fill="#333" text-anchor="middle">-</text>
                    <text x="190" y="103" font-size="10" fill="#333" text-anchor="middle">+</text>
                    
                    <!-- الأرقام داخل القرص -->
                    <text id="circle-degree" x="100" y="85" class="circle-degree" text-anchor="middle">${formatAngle(beta)}</text>
                    <text x="100" y="105" font-size="10" fill="#666" text-anchor="middle">درجة</text>
                    
                    <!-- الفقاعة -->
                    <circle id="bubble" cx="${x}" cy="${y}" r="15" fill="${color}"/>
                    <circle id="bubble-highlight" cx="${x-4}" cy="${y-4}" r="4" fill="#fff" opacity="0.7"/>
                </svg>
            </div>`;
        }

        function updateDynamicGauges() {
            const bubble = document.getElementById('bubble');
            const bubbleHighlight = document.getElementById('bubble-highlight');
            if (bubble) {
                const { beta, gamma } = getDisplayAngle();
                const max = 10;
                const x = 100 + (Math.max(-max, Math.min(max, gamma)) / max) * 60;
                const y = 100 - (Math.max(-max, Math.min(max, beta)) / max) * 60;
                const total = Math.sqrt(beta*beta + gamma*gamma);
                let color = '#10B981', state = 'good';
                if (total < 0.5) { color = '#4FC3F7'; state = 'excellent'; }
                else if (total < 1.5) { color = '#10B981'; state = 'good'; }
                else if (total < 3.0) { color = '#FFB74D'; state = 'warning'; }
                else { color = '#FF6B6B'; state = 'danger'; }
                
                bubble.setAttribute('cx', x);
                bubble.setAttribute('cy', y);
                bubble.setAttribute('fill', color);
                if (bubbleHighlight) { bubbleHighlight.setAttribute('cx', x-4); bubbleHighlight.setAttribute('cy', y-4); }

                // تحديث النص الرقمي داخل القرص
                const circleDegree = document.getElementById('circle-degree');
                if (circleDegree) circleDegree.textContent = formatAngle(beta);

                // تحديث المؤشر
                const indicator = document.querySelector('.status-indicator');
                if (indicator) {
                    indicator.className = `status-indicator ${state}`;
                    if (state === 'excellent') indicator.textContent = '✔';
                    else if (state === 'good') indicator.textContent = '✅';
                    else if (state === 'warning') indicator.textContent = '⚠️';
                    else indicator.textContent = '❌';
                }
            }

            // تحديث العدادات الرقمية الحية (Beta و Gamma)
            const betaValue = document.getElementById('live-beta');
            const gammaValue = document.getElementById('live-gamma');
            if (betaValue && gammaValue) {
                const { beta, gamma } = getDisplayAngle();
                betaValue.textContent = formatAngle(beta);
                betaValue.style.color = angleColor(beta);
                gammaValue.textContent = formatAngle(gamma);
                gammaValue.style.color = angleColor(gamma);
            }
        }

        // --- الرسم البياني النهائي ---
        function renderChart(data, warningMessage) {
            let svgParts = `<circle cx="100" cy="100" r="90" fill="none" stroke="#eee" stroke-width="1" />`;
            svgParts += `<circle cx="100" cy="100" r="60" fill="none" stroke="#eee" stroke-width="1" />`;
            svgParts += `<circle cx="100" cy="100" r="30" fill="none" stroke="#eee" stroke-width="1" />`;
            svgParts += `<line x1="100" y1="10" x2="100" y2="190" stroke="#ddd" /><line x1="10" y1="100" x2="190" y2="100" stroke="#ddd" />`;
            data.forEach((r, i) => {
                const val = r.value !== null ? r.value : 0;
                const radius = (Math.abs(val) / 5) * 90;
                let x = 100, y = 100;
                if (i === 0) y = 100 - radius;
                if (i === 1) y = 100 + radius;
                if (i === 2) x = 100 + radius;
                if (i === 3) x = 100 - radius;
                const color = angleColor(val);
                svgParts += `<circle cx="${x}" cy="${y}" r="10" fill="${color}" stroke="#fff" stroke-width="2" />`;
            });
            let html = `<div class="chart-container"><div class="chart-title">📊 تحليل الزوايا</div><svg class="chart-svg" viewBox="0 0 200 200">${svgParts}</svg></div>`;
            if (warningMessage) html += `<div class="step-description" style="border-right-color:#FF6B6B;background:#FFE5E5;color:#c0392b;font-size:12px;"><strong>⚠️</strong> ${warningMessage}</div>`;
            return html;
        }

        // --- عرض الخطوات ---
        function renderStep(index) {
            const step = steps[index];
            if (!step) return;
            const total = steps.length - 1;
            progressText.textContent = `الخطوة ${index}/${total}`;
            progressFill.style.width = `${(index / total) * 100}%`;
            stepTitle.textContent = step.title;

            let html = `<div class="step-description">${step.desc}</div>`;
            if (step.visual) html += `<div class="visual-helper">${step.visual}</div>`;
            
            if (step.showCircular || step.id === 'ground') {
                const { beta, gamma } = getDisplayAngle();
                html += renderCircularGauge(beta, gamma);
                if (!sensorActive && !sensorError) html += `<button class="action-btn btn-sensor" id="enable-sensor">📱 تفعيل الحساسات</button>`;
                else if (sensorError) html += `<div style="background:#FFE5E5;color:#c0392b;padding:8px;border-radius:8px;text-align:center;">الرجاء تفعيل الحساسات من إعدادات المتصفح</div>`;
            }

            if (step.id !== 'intro' && step.id !== 'report') {
                const { beta, gamma } = getDisplayAngle();
                html += `<div class="angle-big" style="color:${angleColor(beta)}">${formatAngle(beta)}<span class="angle-deg">°</span></div>`;
                html += `<div class="sub-reading">
                            <div class="sub-card">
                                <div class="sub-label">📐 Beta</div>
                                <div class="sub-value value-beta" id="live-beta">${formatAngle(beta)}</div>
                            </div>
                            <div class="sub-card">
                                <div class="sub-label">📏 Gamma</div>
                                <div class="sub-value value-gamma" id="live-gamma">${formatAngle(gamma)}</div>
                            </div>
                         </div>`;
            }

            if (step.hasRecordButton) { html += `<div class="action-row"><button class="action-btn btn-record" id="record-btn">${readings.ground !== null ? '✅ تم التسجيل' : '📝 تسجيل'}</button></div>`; }
            if (step.hasTareButton) { html += `<div class="action-row"><button class="action-btn btn-tare" id="tare-action-btn" ${tareDone ? 'disabled' : ''}>${tareDone ? '✅ تمت المعايرة' : '🎯 معايرة الصفر'}</button></div>`; }

            if (step.checklist) { html += `<div class="checklist" style="background:var(--card-bg);border-radius:10px;padding:8px;border:1px solid var(--border-color);">`; step.checklist.forEach(item => { html += `<div style="display:flex;gap:8px;padding:5px 0;font-size:12px;"><span>${item.icon}</span> ${item.text}</div>`; }); html += `</div>`; }
            if (step.isReport) {
                const reportData = [ { label: 'FR', key: 'fr' }, { label: 'FL', key: 'fl' }, { label: 'RR', key: 'rr' }, { label: 'RL', key: 'rl' } ];
                let warningMsg = null;
                if (floorWarningAccepted) warningMsg = "تم بدء القياس على أرض غير مستوية، قد تكون النتائج بها هامش خطأ.";
                html += renderChart(reportData.map(r => ({ label: r.label, value: readings[r.key] })), warningMsg);
                html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;">`;
                reportData.forEach(r => { const val = readings[r.key]; const display = val !== null ? formatAngle(val) : 'لم تقاس'; const icon = val !== null ? (Math.abs(val) < 1.5 ? '✅' : '⚠️') : '⬜'; html += `<div class="sub-card"><span>${icon} ${r.label}</span><br><strong>${display}</strong></div>`; });
                html += `</div>`;
            }
            stepContent.innerHTML = html;

            if (step.id === 'ground') { const sensorBtn = document.getElementById('enable-sensor'); if (sensorBtn) sensorBtn.addEventListener('click', enableSensors); }
            if (step.hasRecordButton) { const recordBtn = document.getElementById('record-btn'); if (recordBtn) recordBtn.addEventListener('click', recordGround); }
            if (step.hasTareButton) { const tareBtn = document.getElementById('tare-action-btn'); if (tareBtn) tareBtn.addEventListener('click', performTare); }

            navBack.style.display = index === 0 ? 'none' : 'flex';

            if (step.id === 'intro') { navNext.textContent = '🚀 بدء القياس'; navNext.className = 'nav-btn btn-success'; navNext.disabled = false; }
            else if (step.isReport) { navNext.textContent = '🔄 إعادة القياس'; navNext.className = 'nav-btn btn-secondary'; navNext.disabled = false; }
            else if (step.id === 'tare') { navNext.textContent = tareDone ? '✅ متابعة ➜' : '⏳ انتظر المعايرة...'; navNext.className = `nav-btn ${tareDone ? 'btn-primary' : 'btn-secondary'}`; navNext.disabled = !tareDone; }
            else if (step.id === 'ground') { navNext.textContent = readings.ground !== null ? '✅ متابعة ➜' : '⏳ سجل الأرض أولاً'; navNext.className = `nav-btn ${readings.ground !== null ? 'btn-primary' : 'btn-secondary'}`; navNext.disabled = readings.ground === null; }
            else { const side = step.side; const isMeasured = side && readings[side] !== null; navNext.textContent = isMeasured ? '✅ تم، تابع ➜' : '📐 تأكيد القراءة'; navNext.className = `nav-btn ${isMeasured ? 'btn-success' : 'btn-primary'}`; navNext.disabled = false; }
            
            statusMsg.textContent = index === 0 ? 'اقرأ التعليمات' : (step.id === 'tare' ? 'اضغط المعايرة' : 'ضع الهاتف على الجنط');
            updateDynamicGauges();
        }

        // --- دالة الوميض الأخضر لزر المتابعة ---
        function pulseNextButton() {
            navNext.classList.add('nav-pulse');
            setTimeout(() => {
                navNext.classList.remove('nav-pulse');
            }, 3000); // يستمر الوميض لمدة 3 ثوانٍ
        }

        // --- تسجيل القراءات والتحذير (الإصلاح الجوهري هنا) ---
        function recordGround() {
            if (!sensorActive) { alert("الرجاء تفعيل الحساسات أولاً!"); return; }
            const { beta } = getDisplayAngle();
            const isFloorLevel = Math.abs(beta) < 0.5;
            
            function saveReading() { 
                readings.ground = beta; 
                playSound('good'); vibrate('good'); 
                flashElement('record-btn'); 
                renderStep(currentStep); // هذا السطر يعيد رسم الخطوة ويحدّث زر التالي
                pulseNextButton(); // الوميض الأخضر بعد التسجيل
            }
            
            if (!isFloorLevel && !floorWarningAccepted) {
                customModal.style.display = 'flex';
                modalContinue.onclick = function() { 
                    floorWarningAccepted = true; 
                    customModal.style.display = 'none'; // إخفاء النافذة أولاً
                    saveReading(); // ثم الحفظ وتحديث الواجهة
                };
                modalCancel.onclick = function() { 
                    customModal.style.display = 'none'; 
                };
            } else { saveReading(); }
        }

        function performTare() {
            tareOffset.beta = rawBeta; tareOffset.gamma = rawGamma; tareDone = true;
            playSound('good'); vibrate('good'); 
            renderStep(currentStep);
            pulseNextButton();
        }

        // --- تسجيل قراءات العجلات ---
        function saveWheelReading(side) {
            const { beta, gamma } = getDisplayAngle();
            readings[side] = beta;
            playSound(beta < 1.5 ? 'good' : 'warning');
            vibrate(beta < 1.5 ? 'good' : 'warning');
            renderStep(currentStep);
            pulseNextButton();
        }

        // --- زر التالي (التنقل) ---
        navNext.addEventListener('click', () => {
            const step = steps[currentStep];
            
            if (step.side && readings[step.side] === null) {
                saveWheelReading(step.side);
            }
            
            if (step.isReport) {
                readings = { ground: null, fr: null, fl: null, rr: null, rl: null };
                tareOffset = { beta: 0, gamma: 0 }; tareDone = false; floorWarningAccepted = false;
                currentStep = 0; renderStep(currentStep); return;
            }
            if (currentStep < steps.length - 1) { currentStep++; renderStep(currentStep); }
        });

        // --- تفعيل الحساسات ---
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', handleOrientation);
            if (typeof DeviceOrientationEvent.requestPermission !== 'function') sensorActive = true;
        } else sensorError = true;

        // --- بداية ---
        renderStep(0);
    })();
</script>
</body>
</html>
