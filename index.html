<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e">
    <link rel="manifest" href="manifest.json">
    <title>معايرة زوايا السيارة - دليل تفاعلي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; direction: rtl; }
        html, body {
            width: 100%; height: 100%; height: 100dvh; overflow: hidden;
            background: #0a0f1e; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
            position: fixed; top: 0; left: 0;
            display: flex; flex-direction: column;
        }
        /* شريط التقدم */
        #progress-bar {
            padding: 20px 20px 10px;
            display: flex; align-items: center; gap: 10px;
            background: linear-gradient(180deg, #141b2b 0%, transparent 100%);
            z-index: 10;
        }
        #progress-text { font-size: 14px; font-weight: 600; color: #8e9aaf; min-width: 70px; }
        .progress-track { flex: 1; height: 6px; background: #1a2233; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #4fc3f7); border-radius: 10px; transition: width 0.5s; }
        #step-title {
            font-size: 18px; font-weight: 700; padding: 5px 20px 0;
            background: linear-gradient(135deg, #fff, #8e9aaf); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        /* منطقة المحتوى */
        #content-area {
            flex: 1; padding: 10px 20px 5px; overflow-y: auto;
            display: flex; flex-direction: column;
        }
        .step-description {
            font-size: 15px; color: #c8d0dc; line-height: 1.6; margin-bottom: 12px;
            background: rgba(255,255,255,0.04); padding: 14px; border-radius: 16px;
            border-right: 4px solid #2563eb;
        }
        .visual-helper {
            display: flex; justify-content: center; align-items: center;
            font-size: 70px; padding: 10px 0; background: rgba(255,255,255,0.02);
            border-radius: 24px; border: 1px dashed rgba(255,255,255,0.1);
            min-height: 120px; margin-bottom: 10px;
        }
        .angle-big {
            font-size: 70px; font-weight: 800; font-family: 'Courier New', monospace;
            text-align: center; padding: 10px 0; direction: ltr;
            transition: color 0.2s;
        }
        .angle-deg { font-size: 30px; font-weight: 300; color: #8e9aaf; }
        .sub-reading {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 5px 0 15px;
        }
        .sub-card {
            background: rgba(255,255,255,0.04); border-radius: 14px; padding: 10px; text-align: center;
        }
        .sub-label { font-size: 11px; color: #8e9aaf; }
        .sub-value { font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace; }
        .value-beta { color: #4fc3f7; } .value-gamma { color: #ffb74d; }

        .checklist {
            background: rgba(255,255,255,0.03); border-radius: 16px; padding: 12px 16px;
            margin: 10px 0; border: 1px solid rgba(255,255,255,0.06);
        }
        .checklist-item {
            display: flex; align-items: center; gap: 12px; padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 14px; color: #c8d0dc;
        }
        .checklist-item:last-child { border-bottom: none; }
        .check-icon { font-size: 22px; width: 30px; text-align: center; }

        /* أزرار التنقل */
        #nav-buttons {
            padding: 15px 20px 25px;
            display: flex; gap: 12px; justify-content: space-between;
            background: linear-gradient(0deg, #0a0f1e 60%, transparent);
        }
        .nav-btn {
            padding: 14px 24px; border-radius: 60px; border: none; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.2s; flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .nav-btn:active { transform: scale(0.95); }
        .btn-primary { background: #2563eb; color: white; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #2d3748; color: #e2e8f0; border: 1px solid #4a5568; }
        .btn-success { background: #10b981; color: white; box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4); }
        .btn-warning { background: #f59e0b; color: #1a2233; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3); }
        .btn-outline { background: transparent; color: #8e9aaf; border: 1px solid #3a4a5a; }
        #nav-back { flex: 0.5; } #nav-next { flex: 1.5; }

        .status-msg {
            text-align: center; font-size: 12px; color: #6a7a8e; padding: 6px;
            min-height: 30px; border-top: 1px solid rgba(255,255,255,0.03);
        }

        @media (max-width: 450px) {
            .angle-big { font-size: 50px; }
            .visual-helper { font-size: 50px; min-height: 80px; }
            .nav-btn { font-size: 14px; padding: 12px 16px; }
        }
    </style>
</head>
<body>

    <div id="progress-bar">
        <span id="progress-text">الخطوة 0/6</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div id="step-title">📋 تعليمات ما قبل البدء</div>

    <div id="content-area">
        <!-- سيتم ملء المحتوى بواسطة JavaScript -->
        <div id="step-content"></div>
    </div>

    <div id="nav-buttons">
        <button class="nav-btn btn-secondary" id="nav-back">↩ رجوع</button>
        <button class="nav-btn btn-primary" id="nav-next">التالي ➜</button>
    </div>
    <div class="status-msg" id="status-msg">💡 اتبع الخطوات بالترتيب للحصول على أفضل النتائج</div>

<script>
    (function() {
        // --- بيانات الخطوات ---
        const steps = [
            {
                id: 'intro',
                title: '📋 تعليمات ما قبل البدء',
                desc: 'اقرأ التعليمات جيداً، ثم اضغط "بدء القياس" للانتقال للخطوة التالية.',
                visual: '🛠️',
                checklist: [
                    { icon: '✅', text: 'السيارة على أرض مستوية (موقف البيت أو الشارع المسطح).' },
                    { icon: '✅', text: 'تأكد من أن ضغط الإطارات مطابق للتوصيات.' },
                    { icon: '✅', text: 'أطفئ المحرك واشدد فرامل اليد.' },
                    { icon: '✅', text: 'جهز هاتفك (يفضل خلع الغطاء الواقي).' }
                ],
                action: { label: '🚀 بدء القياس', class: 'btn-success' }
            },
            {
                id: 'tare',
                title: '🎯 الخطوة 1: معايرة الصفر (Tare)',
                desc: 'ضع الهاتف مسطحاً على أرضية السيارة الداخلية (بجانب المقعد) أو على عتبة الباب المعدنية. ثم اضغط "معايرة الصفر" لتحديد مستوى الأرض.',
                visual: '📱',
                showAngle: true,
                action: { label: '🎯 معايرة الصفر (Tare)', class: 'btn-warning' }
            },
            {
                id: 'fr',
                title: '🚗 الخطوة 2: قياس العجلة الأمامية اليمنى (FR)',
                desc: 'ضع الهاتف عمودياً على الجنط المعدني للعجلة الأمامية اليمنى (جهة الراكب). تأكد من التصاقه بالمعدن وعدم وجود أوساخ.',
                visual: '↗️',
                showAngle: true,
                action: { label: '✅ تأكيد قراءة FR', class: 'btn-success' }
            },
            {
                id: 'fl',
                title: '🚗 الخطوة 3: قياس العجلة الأمامية اليسرى (FL)',
                desc: 'ضع الهاتف عمودياً على الجنط المعدني للعجلة الأمامية اليسرى (جهة السائق). نفس الطريقة، تأكد من الاستقامة.',
                visual: '↖️',
                showAngle: true,
                action: { label: '✅ تأكيد قراءة FL', class: 'btn-success' }
            },
            {
                id: 'rr',
                title: '🚙 الخطوة 4: قياس العجلة الخلفية اليمنى (RR) - اختياري',
                desc: 'للحصول على تقرير كامل، ضع الهاتف على الجنط الخلفي الأيمن. يمكنك تخطي هذه الخطوة إذا أردت.',
                visual: '🔽',
                showAngle: true,
                action: { label: '✅ تأكيد قراءة RR', class: 'btn-success' }
            },
            {
                id: 'rl',
                title: '🚙 الخطوة 5: قياس العجلة الخلفية اليسرى (RL) - اختياري',
                desc: 'ضع الهاتف على الجنط الخلفي الأيسر. هذه آخر قراءة اختيارية.',
                visual: '🔄',
                showAngle: true,
                action: { label: '✅ تأكيد قراءة RL', class: 'btn-success' }
            },
            {
                id: 'report',
                title: '📊 التقرير النهائي',
                desc: 'إليك ملخص جميع القراءات المسجلة مع تقييم أولي لكل زاوية.',
                visual: '📈',
                isReport: true,
                action: { label: '🔄 إعادة القياس', class: 'btn-secondary' }
            }
        ];

        // --- متغيرات التطبيق ---
        let currentStep = 0;
        let readings = { fr: null, fl: null, rr: null, rl: null };
        let tareOffset = { beta: 0, gamma: 0 };
        let rawBeta = 0, rawGamma = 0;
        let isSensorActive = false;
        let tareDone = false;

        // --- عناصر DOM ---
        const stepContent = document.getElementById('step-content');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const stepTitle = document.getElementById('step-title');
        const navBack = document.getElementById('nav-back');
        const navNext = document.getElementById('nav-next');
        const statusMsg = document.getElementById('status-msg');

        // --- دوال مساعدة ---
        function getDisplayAngle() {
            const beta = rawBeta - tareOffset.beta;
            return { beta, gamma: rawGamma - tareOffset.gamma };
        }

        function angleColor(angle) {
            const abs = Math.abs(angle);
            if (abs < 1.0) return '#4fc3f7';
            if (abs < 2.0) return '#f59e0b';
            return '#ef4444';
        }

        function formatAngle(angle) {
            const sign = angle >= 0 ? '+' : '';
            return `${sign}${angle.toFixed(2)}°`;
        }

        // --- عرض الخطوة الحالية ---
        function renderStep(index) {
            const step = steps[index];
            if (!step) return;

            // تحديث شريط التقدم
            const total = steps.length - 1;
            progressText.textContent = `الخطوة ${index}/${total}`;
            progressFill.style.width = `${(index / total) * 100}%`;
            stepTitle.textContent = step.title;

            // بناء محتوى الخطوة
            let html = '';

            // الوصف
            html += `<div class="step-description">${step.desc}</div>`;

            // المساعد البصري
            if (step.visual) {
                html += `<div class="visual-helper">${step.visual}</div>`;
            }

            // عرض الزاوية (إذا كانت الخطوة تعرضها)
            if (step.showAngle) {
                const { beta, gamma } = getDisplayAngle();
                const color = angleColor(beta);
                html += `
                    <div class="angle-big" style="color:${color}">
                        ${formatAngle(beta)}<span class="angle-deg">°</span>
                    </div>
                    <div class="sub-reading">
                        <div class="sub-card">
                            <div class="sub-label">📐 الميلان الجانبي (Camber)</div>
                            <div class="sub-value value-beta">${formatAngle(beta)}</div>
                        </div>
                        <div class="sub-card">
                            <div class="sub-label">📏 الميلان الأمامي (Caster)</div>
                            <div class="sub-value value-gamma">${formatAngle(gamma)}</div>
                        </div>
                    </div>
                `;
            }

            // قائمة التدقيق (للخطوة الأولى فقط)
            if (step.checklist) {
                html += `<div class="checklist">`;
                step.checklist.forEach(item => {
                    html += `<div class="checklist-item"><span class="check-icon">${item.icon}</span> ${item.text}</div>`;
                });
                html += `</div>`;
            }

            // التقرير النهائي
            if (step.isReport) {
                html += `<div class="checklist">`;
                const reportData = [
                    { label: 'العجلة الأمامية اليمنى (FR)', key: 'fr', defaultVal: 'لم تقاس' },
                    { label: 'العجلة الأمامية اليسرى (FL)', key: 'fl', defaultVal: 'لم تقاس' },
                    { label: 'العجلة الخلفية اليمنى (RR)', key: 'rr', defaultVal: 'لم تقاس' },
                    { label: 'العجلة الخلفية اليسرى (RL)', key: 'rl', defaultVal: 'لم تقاس' }
                ];
                reportData.forEach(r => {
                    const val = readings[r.key];
                    const display = val !== null ? formatAngle(val) + '°' : r.defaultVal;
                    const color = val !== null ? angleColor(val) : '#6a7a8e';
                    html += `
                        <div class="checklist-item">
                            <span class="check-icon">${val !== null ? '✅' : '⬜'}</span>
                            ${r.label}: <span style="color:${color};font-weight:bold;margin-right:auto;font-family:monospace;">${display}</span>
                        </div>
                    `;
                });
                html += `</div>`;
                if (readings.fr !== null && readings.fl !== null) {
                    const diff = Math.abs(readings.fr - readings.fl);
                    html += `<div class="step-description" style="border-right-color:#f59e0b;text-align:center;">
                        🔍 الفرق بين الأماميتين: <strong>${diff.toFixed(2)}°</strong>
                        ${diff < 0.8 ? ' ✅ ممتاز (الفرق ضمن الحد المسموح)' : ' ⚠️ يفضل مراجعة ميكانيكي (الفرق كبير)'}
                    </div>`;
                }
            }

            stepContent.innerHTML = html;

            // تحديث زر الإجراء المخصص (إن وجد)
            if (step.action) {
                const actionBtn = document.getElementById('nav-next');
                actionBtn.textContent = step.action.label;
                actionBtn.className = `nav-btn ${step.action.class}`;
                // إذا كانت الخطوة الأولى، نغير النص
                if (index === 0) {
                    actionBtn.textContent = '🚀 بدء القياس';
                    actionBtn.className = 'nav-btn btn-success';
                }
                if (step.isReport) {
                    actionBtn.textContent = '🔄 إعادة القياس';
                    actionBtn.className = 'nav-btn btn-secondary';
                }
            }

            // إدارة أزرار التنقل
            navBack.style.display = index === 0 ? 'none' : 'flex';
            // إذا كانت الخطوة الأولى، نعطي زر التالي دور "بدء"
            if (index === 0) {
                navNext.textContent = '🚀 بدء القياس';
                navNext.className = 'nav-btn btn-success';
            } else if (step.isReport) {
                navNext.textContent = '🔄 إعادة القياس';
                navNext.className = 'nav-btn btn-secondary';
            } else {
                navNext.textContent = '✅ تأكيد ومتابعة';
                navNext.className = 'nav-btn btn-primary';
            }

            // تحديث رسالة الحالة
            if (index === 0) statusMsg.textContent = '📖 اقرأ التعليمات جيداً قبل البدء';
            else if (index === 1) statusMsg.textContent = '📱 ضع الهاتف على سطح مستوٍ ثم اضغط "معايرة الصفر"';
            else if (step.showAngle) statusMsg.textContent = '📐 ضع الهاتف عمودياً على الجنط كما هو موضح';
            else statusMsg.textContent = '💡 اتبع الخطوات بالترتيب للحصول على أفضل النتائج';

            // تحديث حالة الزر "التالي" بناءً على المعايرة
            updateNextButtonState(index);
        }

        function updateNextButtonState(index) {
            const step = steps[index];
            if (!step) return;
            // في خطوة المعايرة، نمنع الانتقال حتى تتم المعايرة
            if (step.id === 'tare') {
                navNext.disabled = !tareDone;
                if (!tareDone) {
                    navNext.textContent = '⏳ انتظر المعايرة...';
                } else {
                    navNext.textContent = '✅ تمت المعايرة، تابع ➜';
                    navNext.className = 'nav-btn btn-success';
                }
            } else {
                navNext.disabled = false;
            }
            // في التقرير النهائي، نمنع الانتقال لأنه آخر خطوة
            if (step.isReport) {
                navNext.textContent = '🔄 إعادة القياس';
                navNext.className = 'nav-btn btn-secondary';
                navNext.disabled = false;
            }
        }

        // --- دوال المستشعرات ---
        function handleOrientation(event) {
            if (!event.beta && event.beta !== 0) return;
            rawBeta = event.beta || 0;
            rawGamma = event.gamma || 0;
            isSensorActive = true;
            // إعادة عرض الخطوة الحالية لتحديث الأرقام
            renderStep(currentStep);
        }

        function initSensors() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                                statusMsg.textContent = '✅ المستشعرات مفعلة.';
                            } else {
                                statusMsg.textContent = '⛔ تم رفض صلاحية المستشعرات.';
                            }
                        })
                        .catch(() => {});
                } else {
                    window.addEventListener('deviceorientation', handleOrientation, true);
                }
            } else {
                statusMsg.textContent = '❌ هاتفك لا يدعم مستشعرات الميلان.';
            }
        }

        // --- دوال المعايرة والقراءات ---
        function performTare() {
            if (!isSensorActive) {
                statusMsg.textContent = '⚠️ انتظر حتى تظهر القراءات أولاً.';
                return;
            }
            tareOffset.beta = rawBeta;
            tareOffset.gamma = rawGamma;
            tareDone = true;
            statusMsg.textContent = '✅ تمت المعايرة بنجاح! يمكنك الانتقال للخطوة التالية.';
            renderStep(currentStep);
        }

        function confirmReading(side) {
            const { beta } = getDisplayAngle();
            readings[side] = beta;
            statusMsg.textContent = `✅ تم تسجيل قراءة ${side.toUpperCase()}: ${formatAngle(beta)}`;
            // الانتقال للخطوة التالية تلقائياً بعد التأكيد
            if (currentStep < steps.length - 1) {
                setTimeout(() => { goToStep(currentStep + 1); }, 400);
            }
        }

        // --- التنقل بين الخطوات ---
        function goToStep(index) {
            if (index < 0 || index >= steps.length) return;
            currentStep = index;
            renderStep(currentStep);
        }

        function handleNext() {
            const step = steps[currentStep];
            if (!step) return;

            // الخطوة الأولى: بدء القياس
            if (step.id === 'intro') {
                goToStep(1);
                return;
            }

            // خطوة المعايرة
            if (step.id === 'tare') {
                if (!tareDone) {
                    performTare();
                } else {
                    goToStep(currentStep + 1);
                }
                return;
            }

            // خطوات القياس (fr, fl, rr, rl)
            if (['fr', 'fl', 'rr', 'rl'].includes(step.id)) {
                const side = step.id;
                if (readings[side] === null) {
                    // إذا لم تؤكد القراءة، نطلب التأكيد أولاً
                    const { beta } = getDisplayAngle();
                    readings[side] = beta;
                    statusMsg.textContent = `✅ تم تسجيل قراءة ${side.toUpperCase()}: ${formatAngle(beta)}`;
                    setTimeout(() => {
                        if (currentStep < steps.length - 1) goToStep(currentStep + 1);
                    }, 300);
                } else {
                    if (currentStep < steps.length - 1) goToStep(currentStep + 1);
                }
                return;
            }

            // التقرير النهائي: إعادة الضبط
            if (step.isReport) {
                resetAll();
                return;
            }

            // الانتقال العادي
            if (currentStep < steps.length - 1) {
                goToStep(currentStep + 1);
            }
        }

        function handleBack() {
            if (currentStep > 0) {
                // لا نسمح بالرجوع إلى خطوة المعايرة إذا كانت تمت
                if (steps[currentStep - 1]?.id === 'tare' && tareDone) {
                    statusMsg.textContent = '⚠️ لا يمكن الرجوع إلى خطوة المعايرة بعد إتمامها.';
                    return;
                }
                goToStep(currentStep - 1);
            }
        }

        function resetAll() {
            readings = { fr: null, fl: null, rr: null, rl: null };
            tareOffset = { beta: 0, gamma: 0 };
            tareDone = false;
            statusMsg.textContent = '🔄 تم إعادة الضبط. ابدأ من البداية.';
            goToStep(0);
        }

        // --- ربط الأزرار ---
        navNext.addEventListener('click', handleNext);
        navBack.addEventListener('click', handleBack);

        // --- بدء التطبيق ---
        initSensors();
        renderStep(0);

        // محاولة تفعيل ملء الشاشة عند النقر
        document.addEventListener('click', () => {
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } catch (e) {}
        }, { once: true });

        console.log('🚀 دليل معايرة السيارات التفاعلي جاهز!');
    })();
</script>
</body>
</html>
