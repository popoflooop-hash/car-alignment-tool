<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e" id="theme-color">
    <link rel="manifest" href="manifest.json">
    <title>معايرة زوايا السيارة - الخبير</title>
    <style>
        /* --- المتغيرات الأساسية --- */
        :root {
            --snap-yellow: #FFFC00;
            --snap-yellow-dark: #E6E600;
            --snap-blue: #1A2A4A;
            --snap-blue-light: #2A3A6A;
            --snap-white: #FFFFFF;
            --snap-black: #0D0D0D;
            --snap-gray: #F5F5F5;
            --snap-dark-gray: #1A1A1A;
            
            --bg-primary: var(--snap-gray);
            --bg-secondary: var(--snap-white);
            --text-primary: var(--snap-black);
            --text-secondary: #333333;
            --border-color: #E0E0E0;
            --shadow-color: rgba(0,0,0,0.1);
            --card-bg: var(--snap-white);
            --progress-bg: #E0E0E0;
            --status-bg: #F0F0F0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: var(--snap-black);
                --bg-secondary: #1A1A1A;
                --text-primary: var(--snap-white);
                --text-secondary: #CCCCCC;
                --border-color: #333333;
                --shadow-color: rgba(255,255,255,0.05);
                --card-bg: #262626;
                --progress-bg: #333333;
                --status-bg: #1A1A1A;
            }
        }

        .light-mode {
            --bg-primary: var(--snap-gray);
            --bg-secondary: var(--snap-white);
            --text-primary: var(--snap-black);
            --text-secondary: #333333;
            --border-color: #E0E0E0;
            --shadow-color: rgba(0,0,0,0.1);
            --card-bg: var(--snap-white);
            --progress-bg: #E0E0E0;
            --status-bg: #F0F0F0;
        }
        .dark-mode {
            --bg-primary: var(--snap-black);
            --bg-secondary: #1A1A1A;
            --text-primary: var(--snap-white);
            --text-secondary: #CCCCCC;
            --border-color: #333333;
            --shadow-color: rgba(255,255,255,0.05);
            --card-bg: #262626;
            --progress-bg: #333333;
            --status-bg: #1A1A1A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; direction: rtl; }
        html, body {
            width: 100%; height: 100%; height: 100dvh; overflow: hidden;
            background: var(--bg-primary);
            font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
            color: var(--text-primary);
            position: fixed; top: 0; left: 0;
            display: flex; flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        #progress-bar {
            padding: 20px 20px 10px;
            display: flex; align-items: center; gap: 10px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
            transition: background 0.3s;
        }
        #progress-text {
            font-size: 14px; font-weight: 600;
            color: var(--text-secondary);
            min-width: 70px;
        }
        .progress-track {
            flex: 1; height: 6px;
            background: var(--progress-bg);
            border-radius: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: var(--snap-yellow);
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(255, 252, 0, 0.3);
        }

        #step-title {
            font-size: 18px; font-weight: 700;
            padding: 12px 20px 0;
            color: var(--text-primary);
            transition: color 0.3s;
        }

        #content-area {
            flex: 1; padding: 10px 20px 5px; overflow-y: auto;
            display: flex; flex-direction: column;
            gap: 10px;
        }

        .step-description {
            font-size: 15px; color: var(--text-secondary);
            line-height: 1.6;
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 16px;
            border-right: 4px solid var(--snap-yellow);
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: background 0.3s, color 0.3s;
        }

        .visual-helper {
            display: flex; justify-content: center; align-items: center;
            padding: 15px 10px;
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            min-height: 140px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
            white-space: pre;
            color: var(--text-secondary);
            direction: ltr;
            transition: background 0.3s, border-color 0.3s;
            overflow-x: auto;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .angle-big {
            font-size: 70px; font-weight: 800;
            font-family: 'Courier New', monospace;
            text-align: center; padding: 10px 0;
            direction: ltr;
            transition: color 0.2s;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        .angle-deg { font-size: 30px; font-weight: 300; color: var(--text-secondary); }

        .sub-reading {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .sub-card {
            background: var(--card-bg);
            border-radius: 14px; padding: 10px; text-align: center;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: background 0.3s;
        }
        .sub-label { font-size: 11px; color: var(--text-secondary); }
        .sub-value { font-size: 20px; font-weight: 700; font-family: 'Courier New', monospace; }
        .value-beta { color: #4FC3F7; }
        .value-gamma { color: #FFB74D; }

        .action-row {
            display: flex; gap: 12px;
        }
        .action-btn {
            padding: 14px 20px; border-radius: 60px; border: none;
            font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.2s; flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .action-btn:active { transform: scale(0.95); }
        .btn-tare {
            background: var(--snap-yellow); color: var(--snap-black);
            box-shadow: 0 4px 20px rgba(255, 252, 0, 0.3);
        }
        .btn-tare:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-success {
            background: #10B981; color: white;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }
        .btn-primary {
            background: var(--snap-blue); color: white;
            box-shadow: 0 4px 20px rgba(26, 42, 74, 0.3);
        }
        .btn-secondary {
            background: var(--card-bg); color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-record {
            background: #FF6B6B; color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
        }
        /* نافذة التحذير */
        #custom-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal-box {
            background: var(--card-bg);
            padding: 20px; border-radius: 20px;
            max-width: 350px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 10px; color: #FF6B6B; }
        .modal-text { font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
        .modal-btn {
            padding: 12px 20px; margin: 5px; border-radius: 40px;
            font-weight: 700; border: none; cursor: pointer;
        }
        .btn-continue { background: #FF6B6B; color: white; }
        .btn-cancel { background: var(--progress-bg); color: var(--text-secondary); }

        #nav-buttons {
            padding: 15px 20px 25px;
            display: flex; gap: 12px; justify-content: space-between;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            transition: background 0.3s;
        }
        .nav-btn {
            padding: 14px 24px; border-radius: 60px; border: none;
            font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.2s; flex: 1;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        #nav-back { flex: 0.5; }

        .status-msg {
            text-align: center; font-size: 12px;
            color: var(--text-secondary); padding: 6px;
            min-height: 30px;
            background: var(--status-bg);
            border-top: 1px solid var(--border-color);
            transition: background 0.3s, color 0.3s;
        }

        #theme-toggle {
            position: fixed; bottom: 90px; right: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 48px; height: 48px;
            font-size: 22px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #theme-toggle:active { transform: scale(0.9); }

        .bubble-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--border-color);
            margin-top: 10px;
            transition: background 0.3s;
        }
        .bubble-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .bubble-track {
            height: 20px;
            background: var(--progress-bg);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .bubble-fill {
            height: 100%;
            border-radius: 40px;
            transition: width 0.15s ease;
        }
        .bubble-marker {
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 28px;
            background: var(--text-primary);
            opacity: 0.3;
            border-radius: 4px;
        }
        .bubble-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        
        /* --- CSS للرسم البياني --- */
        .chart-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }
        .chart-title { font-weight: 800; margin-bottom: 10px; text-align: center; }
        .bar-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px; font-size: 14px;
        }
        .bar-label { width: 70px; }
        .bar-track { flex: 1; height: 14px; background: var(--progress-bg); border-radius: 7px; margin: 0 8px; overflow: hidden; position: relative; direction: ltr; }
        .bar-fill { height: 100%; border-radius: 7px; transition: width 0.5s; }

        @media (max-width: 450px) {
            .angle-big { font-size: 50px; }
            .visual-helper { font-size: 12px; min-height: 100px; padding: 10px; }
            .nav-btn { font-size: 14px; padding: 12px 16px; }
            .action-btn { font-size: 14px; padding: 12px 16px; }
            #theme-toggle { width: 40px; height: 40px; font-size: 18px; bottom: 80px; right: 10px; }
        }
    </style>
</head>
<body>

    <div id="progress-bar">
        <span id="progress-text">الخطوة 0/7</span>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div id="step-title">📋 تعليمات ما قبل البدء</div>

    <div id="content-area">
        <div id="step-content"></div>
    </div>

    <div id="nav-buttons">
        <button class="nav-btn btn-secondary" id="nav-back">↩ رجوع</button>
        <button class="nav-btn btn-primary" id="nav-next">التالي ➜</button>
    </div>
    <div class="status-msg" id="status-msg">💡 اتبع الخطوات بالترتيب للحصول على أفضل النتائج</div>

    <button id="theme-toggle">🌙</button>

    <!-- نافذة التحذير -->
    <div id="custom-modal">
        <div class="modal-box">
            <div class="modal-title">⚠️ تحذير: الأرض غير مستوية!</div>
            <div class="modal-text">
                <p>قراءة الأرض الحالية تشير إلى وجود ميل واضح. <strong>القياس على أرض غير مستوية سيعطي نتائج خاطئة</strong> في التقرير النهائي.</p>
                <p>هل تريد إلغاء العملية والذهاب إلى أرض مستوية؟</p>
            </div>
            <button class="modal-btn btn-cancel" id="modal-cancel">إلغاء</button>
            <button class="modal-btn btn-continue" id="modal-continue">أكمل على أي حال</button>
        </div>
    </div>

<script>
    (function() {
        // --- بيانات الخطوات مع الرسوم التوضيحية ---
        const steps = [
            { id: 'intro', title: '📋 تعليمات ما قبل البدء', desc: 'اقرأ التعليمات جيداً، ثم اضغط "بدء القياس" للانتقال للخطوة التالية.', 
                visual: `┌─────────────────────────┐
│  🛠️  تجهيز السيارة     │
│                         │
│  🚗 السيارة على أرض    │

│  🔧 ضغط الإطارات صحيح  │
│  🛑 فرامل اليد مشدودة  │
│  📱 جهز الهاتف          │
└─────────────────────────┘`,
                checklist: [
                    { icon: '✅', text: 'السيارة على أرض مستوية (موقف البيت أو الشارع المسطح).' },
                    { icon: '✅', text: 'تأكد من أن ضغط الإطارات مطابق للتوصيات.' },
                    { icon: '✅', text: 'أطفئ المحرك واشدد فرامل اليد.' },
                    { icon: '✅', text: 'جهز هاتفك (يفضل خلع الغطاء الواقي).' }
                ]
            },
            { id: 'ground', title: '🧭 الخطوة 1: قياس مستوى الأرض', desc: 'ضع الهاتف على الأرض بجانب العجلة الأمامية اليمنى. اضغط "تسجيل" لتخزين القراءة.', 
                visual: `┌─────────────────────────────────┐
│          ⚙️                     │
│          ⚙️ (الجنط)            │
│          ⚙️                     │
│  ┌──┐    ⚙️                     │
│  │📱│    ⚙️                     │
│  └──┘    ⚙️                     │
│  (هاتف)                         │
│  🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫  │
│  🟫 (الأرض) 🟫                  │
└─────────────────────────────────┘`,
                showAngle: true, hasRecordButton: true, side: 'ground'
            },
            { id: 'tare', title: '🎯 الخطوة 2: معايرة الصفر (Tare)', desc: 'ضع الهاتف مسطحاً على أرضية السيارة الداخلية، ثم اضغط زر "معايرة الصفر".', 
                visual: `┌─────────────────────────────────┐
│  🪑 مقعد السيارة               │
│  ┌────────────────────────┐    │
│  │  🟫🟫🟫🟫🟫🟫🟫🟫🟫   │    │
│  │  🟫  ┌──┐  🟫          │    │
│  │  🟫  │📱│  🟫 (أرضية  │    │
│  │  🟫  └──┘  🟫  السيارة)│    │
│  │  🟫🟫🟫🟫🟫🟫🟫🟫🟫   │    │
│  └────────────────────────┘    │
└─────────────────────────────────┘`,
                showAngle: true, hasTareButton: true
            },
            { id: 'fr', title: '🚗 الخطوة 3: قياس العجلة الأمامية اليمنى (FR)', desc: 'ضع الهاتف عمودياً على الجنط المعدني للعجلة الأمامية اليمنى.', 
                visual: `┌─────────────────────────────────┐
│         ⚙️                      │
│         ⚙️ (الجنط)    ┌──┐    │
│         ⚙️             │📱│    │
│         ⚙️             └──┘    │
│         ⚙️   (الهاتف عمودي)   │
│         ⚙️                      │
│  🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫  │
│  🟫 (الأرض) 🟫                  │
└─────────────────────────────────┘`,
                showAngle: true, side: 'fr'
            },
            { id: 'fl', title: '🚗 الخطوة 4: قياس العجلة الأمامية اليسرى (FL)', desc: 'ضع الهاتف عمودياً على الجنط المعدني للعجلة الأمامية اليسرى.', 
                visual: `┌─────────────────────────────────┐
│         ⚙️                      │
│         ⚙️ (الجنط)    ┌──┐    │
│         ⚙️             │📱│    │
│         ⚙️             └──┘    │
│         ⚙️   (الهاتف عمودي)   │
│         ⚙️                      │
│  🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫  │
│  🟫 (الأرض) 🟫                  │
└─────────────────────────────────┘`,
                showAngle: true, side: 'fl'
            },
            { id: 'rr', title: '🚙 الخطوة 5: قياس العجلة الخلفية اليمنى (RR) - اختياري', desc: 'ضع الهاتف عمودياً على الجنط الخلفي الأيمن. يمكنك تخطي هذه الخطوة.', 
                visual: `┌─────────────────────────────────┐
│         ⚙️                      │
│         ⚙️ (الجنط)    ┌──┐    │
│         ⚙️             │📱│    │
│         ⚙️             └──┘    │
│         ⚙️   (الهاتف عمودي)   │
│         ⚙️                      │
│  🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫  │
│  🟫 (الأرض) 🟫                  │
└─────────────────────────────────┘`,
                showAngle: true, side: 'rr'
            },
            { id: 'rl', title: '🚙 الخطوة 6: قياس العجلة الخلفية اليسرى (RL) - اختياري', desc: 'ضع الهاتف عمودياً على الجنط الخلفي الأيسر.', 
                visual: `┌─────────────────────────────────┐
│         ⚙️                      │
│         ⚙️ (الجنط)    ┌──┐    │
│         ⚙️             │📱│    │
│         ⚙️             └──┘    │
│         ⚙️   (الهاتف عمودي)   │
│         ⚙️                      │
│  🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫🟫  │
│  🟫 (الأرض) 🟫                  │
└─────────────────────────────────┘`,
                showAngle: true, side: 'rl'
            },
            { id: 'report', title: '📊 التقرير النهائي', desc: 'إليك ملخص جميع القراءات المسجلة مع تقييم أولي لكل زاوية ورسوم بيانية توضيحية.', 
                visual: `┌─────────────────────────┐
│  📈  التقرير النهائي   │
│                         │
│  ✅ FR: +1.2° (ممتاز) │
│  ⚠️ FL: +2.5° (انتباه)│
│  🔴 RR: -3.0° (ضبط)   │
│  ✅ RL: +1.0° (ممتاز) │
└─────────────────────────┘`,
                isReport: true
            }
        ];

        // --- متغيرات التطبيق ---
        let currentStep = 0;
        let readings = { ground: null, fr: null, fl: null, rr: null, rl: null };
        let tareOffset = { beta: 0, gamma: 0 };
        let rawBeta = 0, rawGamma = 0;
        let isSensorActive = false;
        let tareDone = false;
        let floorWarningAccepted = false;

        // --- عناصر DOM ---
        const stepContent = document.getElementById('step-content');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const stepTitle = document.getElementById('step-title');
        const navBack = document.getElementById('nav-back');
        const navNext = document.getElementById('nav-next');
        const statusMsg = document.getElementById('status-msg');
        const themeToggle = document.getElementById('theme-toggle');
        const customModal = document.getElementById('custom-modal');
        const modalCancel = document.getElementById('modal-cancel');
        const modalContinue = document.getElementById('modal-continue');

        // --- تبديل الوضع ---
        let isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light-mode', !isDarkMode);
            document.body.classList.toggle('dark-mode', isDarkMode);
            themeToggle.textContent = isDarkMode ? '☀️' : '🌙';
            document.getElementById('theme-color').content = isDarkMode ? '#0D0D0D' : '#F5F5F5';
        }
        themeToggle.addEventListener('click', toggleTheme);
        if (isDarkMode) { document.body.classList.add('dark-mode'); themeToggle.textContent = '☀️'; }
        else { document.body.classList.add('light-mode'); themeToggle.textContent = '🌙'; }

        // --- دوال مساعدة ---
        function getDisplayAngle() {
            const beta = rawBeta - tareOffset.beta;
            const gamma = rawGamma - tareOffset.gamma;
            return { beta, gamma };
        }

        function angleColor(angle) {
            const abs = Math.abs(angle);
            if (abs < 1.0) return '#4FC3F7';
            if (abs < 2.0) return '#FFB74D';
            return '#FF6B6B';
        }

        function formatAngle(angle) {
            if (angle === null || angle === undefined) return '---';
            const sign = angle >= 0 ? '+' : '';
            return `${sign}${angle.toFixed(2)}°`;
        }

        // --- دالة ميزان المياه ---
        function renderLevelBubble(angle, label = 'المستوى') {
            const percent = 50 + (angle / 5) * 50;
            const clamped = Math.min(100, Math.max(0, percent));
            const color = Math.abs(angle) < 0.5 ? '#10B981' : Math.abs(angle) < 1.5 ? '#FFB74D' : '#FF6B6B';
            return `
                <div class="bubble-container">
                    <div class="bubble-header"><span>${label}</span><span style="color:${color};font-weight:bold;font-family:monospace;">${formatAngle(angle)}</span></div>
                    <div class="bubble-track"><div class="bubble-fill" style="width:${clamped}%;background:${color};"></div><div class="bubble-marker"></div></div>
                    <div class="bubble-labels"><span>− (مائل)</span><span>0 (مستوي)</span><span>+ (مائل)</span></div>
                </div>
            `;
        }

        // --- دالة رسم الرسم البياني للتقارير ---
        function renderChart(data, warningMessage) {
            let html = `<div class="chart-container"><div class="chart-title">📊 مقارنة الزوايا</div>`;
            data.forEach(r => {
                const val = r.value !== null ? r.value : 0;
                const maxAbs = 5;
                const width = Math.min(100, (Math.abs(val) / maxAbs) * 100);
                const color = angleColor(val);
                const label = r.label;
                html += `
                    <div class="bar-row">
                        <div class="bar-label">${label}</div>
                        <div class="bar-track"><div class="bar-fill" style="width:${width}%;background:${color};"></div></div>
                        <div style="width:60px;text-align:center;font-family:monospace;">${formatAngle(r.value)}</div>
                    </div>
                `;
            });
            html += `</div>`;
            
            // إضافة تفصيلة عدم الاستواء إذا وافق المستخدم
            if (warningMessage) {
                html += `<div class="step-description" style="border-right-color:#FF6B6B;background:#FFE5E5;color:#c0392b;font-size:14px;">
                    <strong>⚠️ تنبيه مهم:</strong> ${warningMessage}
                </div>`;
            }
            return html;
        }

        // --- عرض الخطوة الحالية ---
        function renderStep(index) {
            const step = steps[index];
            if (!step) return;

            const total = steps.length - 1;
            progressText.textContent = `الخطوة ${index}/${total}`;
            progressFill.style.width = `${(index / total) * 100}%`;
            stepTitle.textContent = step.title;

            let html = '';
            html += `<div class="step-description">${step.desc}</div>`;

            if (step.visual) html += `<div class="visual-helper">${step.visual}</div>`;

            // --- ميزان المياه في خطوة قياس الأرض ---
            if (step.id === 'ground') {
                const { beta } = getDisplayAngle();
                html += renderLevelBubble(beta, '📏 ميلان الأرض');
            }

            // عرض الزاوية
            if (step.showAngle && step.id !== 'ground') {
                const { beta, gamma } = getDisplayAngle();
                const color = angleColor(beta);
                html += `
                    <div class="angle-big" style="color:${color}">${formatAngle(beta)}<span class="angle-deg">°</span></div>
                    <div class="sub-reading">
                        <div class="sub-card"><div class="sub-label">📐 الميلان الجانبي (Camber)</div><div class="sub-value value-beta">${formatAngle(beta)}</div></div>
                        <div class="sub-card"><div class="sub-label">📏 الميلان الأمامي (Caster)</div><div class="sub-value value-gamma">${formatAngle(gamma)}</div></div>
                    </div>
                `;

                if (['fr', 'fl', 'rr', 'rl'].includes(step.id)) {
                    html += renderLevelBubble(gamma, '📐 عمودية الهاتف على الجنط');
                }
            }

            // زر تسجيل الأرض
            if (step.hasRecordButton) {
                const isRecorded = readings.ground !== null;
                html += `
                    <div class="action-row"><button class="action-btn btn-record" id="record-btn">${isRecorded ? '✅ تم التسجيل' : '📝 تسجيل قراءة الأرض'}</button></div>
                    ${isRecorded ? `<div style="text-align:center;color:#10B981;font-weight:bold;">✅ تم تسجيل: ${formatAngle(readings.ground)}</div>` : ''}
                `;
            }

            // زر المعايرة
            if (step.hasTareButton) {
                html += `
                    <div class="action-row"><button class="action-btn btn-tare" id="tare-action-btn" ${tareDone ? 'disabled' : ''}>${tareDone ? '✅ تمت المعايرة' : '🎯 معايرة الصفر (Tare)'}</button></div>
                    ${tareDone ? '<div style="text-align:center;"><span class="tare-done-badge" style="background:#10B981;color:white;padding:4px 12px;border-radius:40px;font-size:12px;">✅ تمت المعايرة بنجاح</span></div>' : ''}
                `;
            }

            if (step.checklist) {
                html += `<div class="checklist" style="background:var(--card-bg);border-radius:16px;padding:12px 16px;border:1px solid var(--border-color);">`;
                step.checklist.forEach(item => {
                    html += `<div class="checklist-item" style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-color);font-size:14px;"><span style="font-size:22px;width:30px;text-align:center;">${item.icon}</span> ${item.text}</div>`;
                });
                html += `</div>`;
            }

            if (step.isReport) {
                // تجهيز بيانات التقرير والرسم البياني
                const reportData = [
                    { label: 'الأمامية اليمنى (FR)', key: 'fr' },
                    { label: 'الأمامية اليسرى (FL)', key: 'fl' },
                    { label: 'الخلفية اليمنى (RR)', key: 'rr' },
                    { label: 'الخلفية اليسرى (RL)', key: 'rl' }
                ];
                
                let warningMsg = null;
                if (floorWarningAccepted) {
                    warningMsg = "تم بدء عملية القياس على سطح غير مستوٍ. قد تحتوي البيانات المسجلة على هامش خطأ، ويُنصح بإعادة المعايرة على سطح مستوٍ لضمان دقة النتائج النهائية.";
                }

                html += renderChart(reportData.map(r => ({ label: r.label, value: readings[r.key] })), warningMsg);
                
                // التفاصيل النصية
                html += `<div class="checklist" style="background:var(--card-bg);border-radius:16px;padding:12px 16px;border:1px solid var(--border-color);">`;
                reportData.forEach(r => {
                    const val = readings[r.key];
                    const display = val !== null ? formatAngle(val) : 'لم تقاس';
                    const color = val !== null ? angleColor(val) : '#6a7a8e';
                    const icon = val !== null ? (Math.abs(val) < 1.5 ? '✅' : Math.abs(val) < 2.5 ? '⚠️' : '🔴') : '⬜';
                    html += `<div class="checklist-item" style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border-color);font-size:14px;">
                        <span style="font-size:22px;width:30px;text-align:center;">${icon}</span>
                        ${r.label}: <span style="color:${color};font-weight:bold;margin-right:auto;font-family:monospace;">${display}</span>
                    </div>`;
                });
                html += `</div>`;

                if (readings.fr !== null && readings.fl !== null) {
                    const diff = Math.abs(readings.fr - readings.fl);
                    html += `<div class="step-description" style="border-right-color:#FFB74D;text-align:center;">
                        🔍 الفرق بين الأماميتين: <strong>${diff.toFixed(2)}°</strong>
                        ${diff < 0.8 ? ' ✅ ممتاز (الفرق ضمن الحد المسموح)' : ' ⚠️ يفضل مراجعة ميكانيكي (الفرق كبير)'}
                    </div>`;
                }
            }

            stepContent.innerHTML = html;

            // ربط الأزرار
            if (step.hasRecordButton) {
                const recordBtn = document.getElementById('record-btn');
                if (recordBtn) recordBtn.addEventListener('click', recordGround);
            }
            if (step.hasTareButton) {
                const tareBtn = document.getElementById('tare-action-btn');
                if (tareBtn) tareBtn.addEventListener('click', performTare);
            }

            // تحديث أزرار التنقل
            navBack.style.display = index === 0 ? 'none' : 'flex';
            
            if (step.id === 'intro') {
                navNext.textContent = '🚀 بدء القياس';
                navNext.className = 'nav-btn btn-success';
                navNext.disabled = false;
            } else if (step.isReport) {
                navNext.textContent = '🔄 إعادة القياس';
                navNext.className = 'nav-btn btn-secondary';
                navNext.disabled = false;
            } else if (step.id === 'tare') {
                navNext.textContent = tareDone ? '✅ متابعة ➜' : '⏳ انتظر المعايرة...';
                navNext.className = `nav-btn ${tareDone ? 'btn-primary' : 'btn-secondary'}`;
                navNext.disabled = !tareDone;
            } else if (step.id === 'ground') {
                const isRecorded = readings.ground !== null;
                navNext.textContent = isRecorded ? '✅ متابعة ➜' : '⏳ سجل الأرض أولاً';
                navNext.className = `nav-btn ${isRecorded ? 'btn-primary' : 'btn-secondary'}`;
                navNext.disabled = !isRecorded;
            } else {
                const side = step.side;
                const isMeasured = side && readings[side] !== null;
                navNext.textContent = isMeasured ? '✅ تم القياس، تابع ➜' : '📐 تأكيد القراءة';
                navNext.className = `nav-btn ${isMeasured ? 'btn-success' : 'btn-primary'}`;
                navNext.disabled = false;
            }

            if (index === 0) statusMsg.textContent = '📖 اقرأ التعليمات جيداً قبل البدء';
            else if (step.id === 'ground') statusMsg.textContent = readings.ground !== null ? '✅ تم تسجيل الأرض' : '📱 ضع الهاتف على الأرض بجانب العجلة';
            else if (step.id === 'tare') statusMsg.textContent = tareDone ? '✅ تمت المعايرة' : '🎯 اضغط معايرة الصفر';
            else statusMsg.textContent = '📐 ضع الهاتف على الجنط';
        }

        // --- دالة تسجيل الأرض مع التحذير ---
        function recordGround() {
            const { beta } = getDisplayAngle();
            
            // المنطق الجديد: إذا كانت الأرض مائلة أكثر من حد معين ولم يقبل المستخدم التحذير من قبل
            const isFloorLevel = Math.abs(beta) < 0.5; // نعتبر أقل من 0.5 درجة مستوٍ تماماً
            if (!isFloorLevel && !floorWarningAccepted) {
                // إظهار نافذة التحذير
                customModal.style.display = 'flex';
                modalContinue.onclick = function() {
                    floorWarningAccepted = true;
                    readings.ground = beta;
                    customModal.style.display = 'none';
                    renderStep(currentStep);
                };
                modalCancel.onclick = function() {
                    customModal.style.display = 'none';
                };
            } else {
                // إذا كان مستوياً أو وافق مسبقاً
                readings.ground = beta;
                renderStep(currentStep);
            }
        }

        // --- دالة المعايرة ---
        function performTare() {
            tareOffset.beta = rawBeta;
            tareOffset.gamma = rawGamma;
            tareDone = true;
            renderStep(currentStep);
        }

        // --- التنقل ---
        navBack.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                renderStep(currentStep);
            }
        });

        navNext.addEventListener('click', () => {
            if (currentStep < steps.length - 1) {
                if (steps[currentStep].id === 'report') {
                    // إعادة تعيين التطبيق
                    currentStep = 0;
                    readings = { ground: null, fr: null, fl: null, rr: null, rl: null };
                    tareOffset = { beta: 0, gamma: 0 };
                    tareDone = false;
                    floorWarningAccepted = false;
                } else {
                    currentStep++;
                }
                renderStep(currentStep);
            }
        });

        // --- تفعيل الحساسات ---
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', function(event) {
                if (event.beta !== null && event.gamma !== null) {
                    rawBeta = event.beta;
                    rawGamma = event.gamma;
                    isSensorActive = true;
                    // تحديث الزاوية المعروضة في الخطوات التي تعرضها
                    const step = steps[currentStep];
                    if (step && step.showAngle && step.id !== 'ground') {
                        const { beta, gamma } = getDisplayAngle();
                        const color = angleColor(beta);
                        const bigAngle = document.querySelector('.angle-big');
                        if (bigAngle) {
                            bigAngle.style.color = color;
                            bigAngle.innerHTML = `${formatAngle(beta)}<span class="angle-deg">°</span>`;
                        }
                        const camberVal = document.querySelector('.value-beta');
                        const casterVal = document.querySelector('.value-gamma');
                        if (camberVal) camberVal.textContent = formatAngle(beta);
                        if (casterVal) casterVal.textContent = formatAngle(gamma);
                    }
                }
            });
        }

        // --- بداية التطبيق ---
        renderStep(0);
    })();
</script>
</body>
</html>
