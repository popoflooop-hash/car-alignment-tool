<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f1e">
    <link rel="manifest" href="manifest.json">
    <title>ميزان زوايا السيارة الإلكتروني</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; direction: rtl; }
        html, body {
            width: 100%; height: 100%; height: 100dvh; overflow: hidden;
            background: #0a0f1e; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff;
            position: fixed; top: 0; left: 0;
            display: flex; flex-direction: column;
        }
        /* رأس الشاشة */
        #header {
            padding: 20px 20px 10px;
            text-align: center;
            background: linear-gradient(180deg, #141b2b 0%, transparent 100%);
            z-index: 10;
        }
        #header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; background: linear-gradient(135deg, #4fc3f7, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #header p { font-size: 12px; color: #6a7a8e; margin-top: 4px; -webkit-text-fill-color: #6a7a8e; }

        /* منطقة الميزان الأساسية */
        #gauge-area {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px;
            position: relative;
        }

        /* عرض الزاوية الرقمي الضخم */
        #angle-display {
            font-size: 80px; font-weight: 800; font-family: 'Courier New', monospace;
            line-height: 1; transition: color 0.2s;
            text-shadow: 0 0 40px rgba(37, 99, 235, 0.2);
            direction: ltr;
        }
        .angle-deg { font-size: 30px; font-weight: 300; color: #8e9aaf; }

        /* شريط الميزان البصري (فقاعة المستوى) */
        #bubble-container {
            width: 85%; max-width: 400px; height: 20px;
            background: #1a2233; border-radius: 40px; margin: 20px 0 10px;
            border: 1px solid #2a3a55; position: relative; overflow: hidden;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
        }
        #bubble-fill {
            height: 100%; width: 50%; background: linear-gradient(90deg, #2563eb, #4fc3f7);
            border-radius: 40px; transition: width 0.1s ease-out;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
        }
        #bubble-center-marker {
            position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 28px; background: #fff; opacity: 0.5; border-radius: 4px;
        }
        #bubble-labels {
            width: 85%; max-width: 400px; display: flex; justify-content: space-between;
            font-size: 11px; color: #5a6a7e; margin-top: 2px;
        }

        /* لوحة التحكم السفلية (الأزرار والقراءات الثانوية) */
        #controls {
            padding: 20px 16px 30px;
            display: flex; flex-direction: column; gap: 14px;
            background: linear-gradient(0deg, #0a0f1e 60%, transparent);
        }
        .dual-reading {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .sub-card {
            background: rgba(255,255,255,0.04); border-radius: 16px; padding: 12px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .sub-label { font-size: 11px; color: #8e9aaf; text-transform: uppercase; letter-spacing: 0.5px; }
        .sub-value { font-size: 22px; font-weight: 700; font-family: 'Courier New', monospace; margin-top: 4px; }
        .sub-value.beta-color { color: #4fc3f7; } /* الميلان الجانبي (Camber) */
        .sub-value.gamma-color { color: #ffb74d; } /* الميلان الأمامي/الخلفي (Caster) */

        .button-row {
            display: flex; gap: 12px; justify-content: center;
        }
        .action-btn {
            padding: 14px 28px; border-radius: 60px; border: none; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: all 0.2s; flex: 1; max-width: 180px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .action-btn:active { transform: scale(0.95); }
        #tare-btn {
            background: #2d3748; color: #e2e8f0; border: 1px solid #4a5568;
        }
        #tare-btn:active { background: #4a5568; }
        #reset-btn {
            background: #1a2233; color: #8e9aaf; border: 1px solid #2a3a55;
        }
        #install-btn {
            background: #2563eb; color: white; border: none; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            max-width: 200px;
        }
        #install-btn:active { background: #1d4ed8; }

        #status-text {
            text-align: center; font-size: 12px; color: #6a7a8e; padding: 4px;
            min-height: 24px;
        }

        @media (max-width: 450px) {
            #angle-display { font-size: 60px; }
            .action-btn { font-size: 14px; padding: 12px 20px; }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>📐 ميزان زوايا السيارات</h1>
        <p>ضع الهاتف على الجنط أو الأرضية لقراءة الميلان الفعلي</p>
    </div>

    <div id="gauge-area">
        <div id="angle-display">0.00<span class="angle-deg">°</span></div>
        
        <div id="bubble-container">
            <div id="bubble-fill" style="width: 50%;"></div>
            <div id="bubble-center-marker"></div>
        </div>
        <div id="bubble-labels">
            <span>− (يسار)</span>
            <span>0 (مستوي)</span>
            <span>+ (يمين)</span>
        </div>
    </div>

    <div id="controls">
        <div class="dual-reading">
            <div class="sub-card">
                <div class="sub-label">📐 الميلان الجانبي (Camber)</div>
                <div class="sub-value beta-color" id="val-beta">0.00°</div>
            </div>
            <div class="sub-card">
                <div class="sub-label">📏 الميلان الأمامي (Caster/منحدر)</div>
                <div class="sub-value gamma-color" id="val-gamma">0.00°</div>
            </div>
        </div>

        <div class="button-row">
            <button class="action-btn" id="tare-btn">🎯 معايرة الصفر (Tare)</button>
            <button class="action-btn" id="reset-btn">↺ إعادة ضبط</button>
            <button class="action-btn" id="install-btn" style="display:none;">📲 تثبيت</button>
        </div>
        <div id="status-text">💡 اضغط "معايرة الصفر" على أرضية مستوية قبل القياس.</div>
    </div>

<script>
    (function() {
        // --- العناصر ---
        const angleDisplay = document.getElementById('angle-display');
        const bubbleFill = document.getElementById('bubble-fill');
        const valBeta = document.getElementById('val-beta');
        const valGamma = document.getElementById('val-gamma');
        const statusText = document.getElementById('status-text');
        const tareBtn = document.getElementById('tare-btn');
        const resetBtn = document.getElementById('reset-btn');
        const installBtn = document.getElementById('install-btn');

        // --- متغيرات الخوارزمية ---
        let rawBeta = 0;    // الميلان الجانبي (Camber)
        let rawGamma = 0;   // الميلان الأمامي/الخلفي
        let offsetBeta = 0;
        let offsetGamma = 0;
        let isSensorActive = false;

        // --- تحديث الواجهة ---
        function updateDisplay(beta, gamma) {
            // الزاوية الرئيسية المعروضة (نأخذ الميلان الجانبي لأنه الأهم لـ Camber)
            const mainAngle = beta;
            const absAngle = Math.abs(mainAngle);
            const sign = mainAngle >= 0 ? '+' : '';
            
            // تحديث الرقم الضخم
            angleDisplay.innerHTML = `${sign}${absAngle.toFixed(2)}<span class="angle-deg">°</span>`;

            // تحديث شريط الفقاعة (نسبة مئوية من -5 درجات إلى +5 درجات)
            let percent = 50 + (mainAngle / 5) * 50; // 5 درجات = طرف الشاشة
            percent = Math.min(100, Math.max(0, percent));
            bubbleFill.style.width = percent + '%';

            // تغيير لون الرقم حسب شدة الميلان (أخضر -> أصفر -> أحمر)
            const intensity = Math.min(absAngle / 3, 1);
            const r = Math.round(100 + 155 * intensity);
            const g = Math.round(255 - 200 * intensity);
            const b = Math.round(255 - 200 * intensity);
            angleDisplay.style.color = `rgb(${r}, ${g}, ${b})`;

            // تحديث البطاقات السفلية
            valBeta.textContent = (beta >= 0 ? '+' : '') + beta.toFixed(2) + '°';
            valGamma.textContent = (gamma >= 0 ? '+' : '') + gamma.toFixed(2) + '°';
        }

        // --- معالجة بيانات المستشعر ---
        function handleOrientation(event) {
            if (!event.beta && event.beta !== 0) return;
            
            // beta: -180 إلى 180 (الميلان للأمام/الخلف) - لكننا نستخدمه كـ "Camber" بتحويل بسيط
            // gamma: -90 إلى 90 (الميلان الجانبي) - نستخدمه كـ "Caster/منحدر"
            // ملاحظة: في وضع الهاتف العمودي (Portrait)، beta يمثل الميلان الجانبي للسيارة، gamma يمثل الميلان الأمامي.
            // لكن لسهولة الاستخدام، نجعل beta هو الميلان الجانبي (Camber) لأنه الأهم.
            let beta = event.beta || 0;
            let gamma = event.gamma || 0;

            // تصحيح: في بعض الهواتف، القيم تكون معكوسة، نتركها كما هي مع إمكانية المعايرة.
            rawBeta = beta;
            rawGamma = gamma;

            // تطبيق معايرة الصفر (Tare)
            const displayBeta = rawBeta - offsetBeta;
            const displayGamma = rawGamma - offsetGamma;

            updateDisplay(displayBeta, displayGamma);
            isSensorActive = true;
            statusText.innerText = '📡 جاري قراءة المستشعرات... حرك الهاتف لترى التغير.';
        }

        // --- تهيئة المستشعرات (لأندرويد 13+) ---
        function initSensors() {
            if (window.DeviceOrientationEvent) {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    // أندرويد 13+ يطلب إذناً خاصاً
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                                statusText.innerText = '✅ المستشعرات مفعلة. انتظر القراءة...';
                            } else {
                                statusText.innerText = '⛔ تم رفض صلاحية المستشعرات. امنح الإذن من الإعدادات.';
                            }
                        })
                        .catch(() => {
                            // بعض المتصفحات تمنع ظهور النافذة
                            statusText.innerText = '⚠️ اضغط على "معايرة الصفر" لتفعيل المستشعرات يدوياً.';
                        });
                } else {
                    // الأندرويد القديم أو المتصفحات الأخرى
                    window.addEventListener('deviceorientation', handleOrientation, true);
                    statusText.innerText = '🔄 المستشعرات تعمل...';
                }
            } else {
                statusText.innerText = '❌ هاتفك لا يدعم مستشعرات الميلان.';
                alert('هاتفك لا يحتوي على جيروسكوب، لا يمكن استخدام التطبيق.');
            }
        }

        // --- أزرار التحكم ---
        // زر المعايرة (Tare): يحدد الوضع الحالي كصفر
        tareBtn.addEventListener('click', () => {
            if (!isSensorActive) {
                // محاولة إجبار المستشعرات على العمل عبر طلب إذن جديد
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(state => {
                        if (state === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation, true);
                            setTimeout(() => { performTare(); }, 300);
                        }
                    });
                } else {
                    statusText.innerText = '⚠️ انتظر حتى تظهر القراءات أولاً.';
                }
                return;
            }
            performTare();
        });

        function performTare() {
            offsetBeta = rawBeta;
            offsetGamma = rawGamma;
            statusText.innerText = '✅ تمت المعايرة! ضع الهاتف على الجنط الآن لقراءة الفرق.';
            // هزة بسيطة للتأكيد
            angleDisplay.style.transition = 'transform 0.1s';
            angleDisplay.style.transform = 'scale(0.9)';
            setTimeout(() => { angleDisplay.style.transform = 'scale(1)'; }, 150);
        }

        // زر إعادة الضبط (يلغي المعايرة)
        resetBtn.addEventListener('click', () => {
            offsetBeta = 0;
            offsetGamma = 0;
            statusText.innerText = '🔄 تم إلغاء المعايرة. عدّل الهاتف على سطح مستوٍ.';
            if (isSensorActive) {
                updateDisplay(rawBeta, rawGamma);
            }
        });

        // --- زر تثبيت التطبيق (PWA) ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    statusText.innerText = '✅ تم تثبيت التطبيق على شاشتك!';
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                alert('لتثبيت التطبيق يدوياً: اضغط على النقاط الثلاث في كروم ← "إضافة إلى الشاشة الرئيسية"');
            }
        });

        // --- تفعيل ملء الشاشة ---
        function goFullscreen() {
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } catch (e) { /* تجاهل */ }
        }
        // نطلب ملء الشاشة عند أول نقرة في أي مكان
        document.addEventListener('click', goFullscreen, { once: true });

        // --- بدء التشغيل ---
        initSensors();

        // جلب قراءة وهمية لتظهر الرقم بشكل جميل لحين تفعيل المستشعر
        setTimeout(() => {
            if (!isSensorActive) {
                // عرض رسالة تفعيل
                statusText.innerText = '👆 اضغط على زر "معايرة الصفر" لتفعيل المستشعرات.';
            }
        }, 2000);
    })();
</script>
</body>
</html>
